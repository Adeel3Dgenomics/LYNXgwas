[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lynxgwas"
version = "0.1.2"
description = "Locus analYsis and geNomic eXplorer — local GWAS loci, LD, and fine-mapping viewer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Alsamman Alsamman" }]
keywords = ["gwas", "genomics", "loci", "fine-mapping", "ld", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/AlsammanAlsamman/LYNXgwas"
Repository = "https://github.com/AlsammanAlsamman/LYNXgwas"
Issues = "https://github.com/AlsammanAlsamman/LYNXgwas/issues"

[project.scripts]
lynxgwas = "lynxgwas.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
lynxgwas = ["_bundled/**/*"]
