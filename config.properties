# GWAS Locus Visualization Tool - Configuration v2
# --------------------------------------------------

# ── Input files ────────────────────────────────────────────────
gwas.file=input/Asianq2EURFIN.tsv
loci.file=input/loci.txt
gff3.file=resources/gencode.v37.annotation.gff3

# ── Reference panel for LD ─────────────────────────────────────
# Population label shown in UI and PDF headers
ref.panel.population=EAS
# PLINK bfile prefix (no extension); .bed/.bim/.fam must exist
ref.panel.path=C:/Users/alsammana/Documents/DataResources/1000genome/g1000_eas
# Leave ref.panel.path blank to disable LD computation
# ref.panel.path=

# ── GWAS column mapping ────────────────────────────────────────
col.chr=chrom
col.pos=pos
col.pvalue=p
col.rsid=
col.varid=varid
col.ea=ea
col.nea=nea

# ── Optional per-locus top-SNP override ───────────────────────
# Tab-delimited: locus_index<TAB>rsid  (1-based row order)
top.snp.file=

# ── Locus window padding (bp each side) ───────────────────────
locus.padding=200000

# ── LD computation ─────────────────────────────────────────────
ld.enabled=true
# Number of SNPs either side of top SNP for pairwise LD triangle
ld.triangle.boundary=100
# r² threshold: SNPs below this excluded from bar track
ld.r2.threshold=0.0
# Max parallel PLINK LD jobs (subset extraction is always sequential)
ld.parallel.jobs=4

# ── Locus splitting validation ─────────────────────────────────
# Max cross-region r² allowed between SNPs in different split sub-loci
split.ld.threshold=0.2
# Min distance (bp) required between split sub-loci boundaries
split.min.distance.bp=250000

# ── Output ─────────────────────────────────────────────────────
output.dir=output

# ── Performance ────────────────────────────────────────────────
threads=4
max.snps.per.locus=5000
