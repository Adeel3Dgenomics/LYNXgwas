tool: cojo_conditional
version: "1.0"
label: "COJO Conditional Analysis (GCTA)"
description: "Stepwise conditional & joint analysis using GCTA-COJO. Identifies independently associated SNPs."
language: R
command: "source('{run_dir}/run_cojo.R')"
requires: [harmonized_gwas, matched_ref]
params:
  - {name: gcta_path, type: string, default: "bin/gcta64.exe", label: "GCTA binary path", description: "Path to GCTA executable."}
  - {name: p_cutoff, type: float, default: "5e-8", label: "P-value threshold"}
  - {name: sample_n, type: int, default: "0", label: "Sample size (N)", description: "Required. Total sample size."}
output_mapping:
  - {raw: cojo_pJ, as: cojo_pJ, scope: per_snp, type: double}
  - {raw: cojo_bJ, as: cojo_bJ, scope: per_snp, type: double}
  - {raw: cojo_bJ_se, as: cojo_bJ_se, scope: per_snp, type: double}
  - {raw: cojo_selected, as: cojo_selected, scope: per_snp, type: boolean}
