tool: coloc
version: "1.0"
label: "Colocalisation (coloc)"
description: "Bayesian colocalisation analysis testing whether two traits share a causal variant at a locus."
language: R
command: "source('{run_dir}/coloc_run.R')"
requires: [harmonized_gwas]
params:
  - {name: trait2_file, type: string, default: "", label: "Trait 2 summary stats", description: "Path to second trait's summary statistics TSV"}
  - {name: trait2_type, type: select, default: "quant", label: "Trait 2 type", options: ["quant", "cc"]}
  - {name: trait2_n, type: int, default: "0", label: "Trait 2 sample size"}
  - {name: trait2_n_cases, type: int, default: "0", label: "Trait 2 N cases (if cc)"}
  - {name: p1, type: float, default: "1e-4", label: "Prior p1", description: "Prior probability a SNP is causal for trait 1"}
  - {name: p2, type: float, default: "1e-4", label: "Prior p2", description: "Prior probability a SNP is causal for trait 2"}
  - {name: p12, type: float, default: "1e-5", label: "Prior p12", description: "Prior probability a SNP is causal for both traits"}
output_mapping:
  - {raw: SNP.PP.H4, as: coloc_pp_h4, scope: per_snp, type: double}
  - {raw: SNP.PP.H3, as: coloc_pp_h3, scope: per_snp, type: double}
  - {raw: SNP.PP.H0, as: coloc_pp_h0, scope: per_snp, type: double}
