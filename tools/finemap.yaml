tool: finemap
version: "1.0"
label: "ABF fine-mapping (Wakefield, single causal variant)"
description: "Wakefield approximate Bayes factor fine-mapping assuming one causal variant per locus (not the FINEMAP software). PIPs come from each SNP's own z-score; LD is not used. Use SuSiE for multiple signals. Requires R packages: data.table."
language: R
command: "source('{run_dir}/run_finemap.R')"
requires: [harmonized_gwas, ld_r]
params:
output_mapping:
  - {raw: finemap_pip, as: finemap_pip, scope: per_snp, type: double}
  - {raw: finemap_log10bf, as: finemap_log10bf, scope: per_snp, type: double}
  - {raw: finemap_cs, as: finemap_cs, scope: per_credible_set, type: int}
