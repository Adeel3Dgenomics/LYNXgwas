// PNG download
// ═══════════════════════════════════════════════════════════════
function downloadPng(panelEl, name) {
  html2canvas(panelEl, {scale:2, useCORS:true}).then(canvas => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = (name||'locus').replace(/\s+/g,'_') + '.png';
    a.click();
  });
}

// ═══════════════════════════════════════════════════════════════
// PDF Export
// ═══════════════════════════════════════════════════════════════
function setupPdfDialog() {
  const cfgModal  = document.getElementById('pdf-config-modal');
  const progModal = document.getElementById('pdf-progress-modal');

  document.getElementById('export-pdf-btn').addEventListener('click', () => {
    cfgModal.classList.add('open');
  });
  document.getElementById('pdf-cfg-close').addEventListener('click',  () => cfgModal.classList.remove('open'));
  document.getElementById('pdf-cfg-cancel').addEventListener('click', () => cfgModal.classList.remove('open'));

  // Custom range row — only show when "custom" is selected
  document.querySelectorAll('input[name="loci-range"]').forEach(r =>
    r.addEventListener('change', () => {
      document.getElementById('custom-range-row').style.opacity =
        r.value === 'custom' ? '1' : '.4';
    })
  );

  // Folder Browse button — calls Java server
  document.getElementById('cfg-browse').addEventListener('click', async () => {
    try {
      const res = await fetchWithTimeout(`${SERVER}/pick-folder`, 60000);
      if (res.ok) {
        const j = await res.json();
        if (j.path) document.getElementById('cfg-folder').value = j.path;
      }
    } catch(e) {
      showToast('Folder picker unavailable — PDF will be saved to browser downloads');
    }
  });

  // Start export
  document.getElementById('pdf-cfg-start').addEventListener('click', () => {
    cfgModal.classList.remove('open');
    const cfg = readPdfConfig();
    progModal.classList.add('open');
    pdfCancelled = false;
    runPdfExport(cfg).finally(() => progModal.classList.remove('open'));
  });

  document.getElementById('pdf-cancel-btn').addEventListener('click', () => {
    pdfCancelled = true;
  });
}

function readPdfConfig() {
  const rangeType = document.querySelector('input[name="loci-range"]:checked').value;
  let lociList;
  if (rangeType === 'all') {
    lociList = lociOrder.slice();
  } else if (rangeType === 'view') {
    const endPos = Math.min(currentStart + VISIBLE, lociOrder.length);
    lociList = lociOrder.slice(currentStart, endPos);
  } else {
    const from = parseInt(document.getElementById('range-from').value) || 1;
    const to   = parseInt(document.getElementById('range-to').value)   || lociOrder.length;
    lociList = lociOrder.slice(Math.max(0, from - 1), to);
  }
  return {
    lociList,
    lociPerPage: parseInt(document.querySelector('input[name="loci-per-page"]:checked').value),
    orientation: document.querySelector('input[name="orientation"]:checked').value,
    pageSize:    document.getElementById('page-size').value,
    inclCtx:     document.getElementById('cfg-ctx').checked,
    inclPlot:    document.getElementById('cfg-plot').checked,
    inclGenes:   document.getElementById('cfg-genes').checked,
    inclLd:      document.getElementById('cfg-ld').checked,
    filename:    document.getElementById('cfg-filename').value || 'gwas_loci_plots.pdf',
    folder:      document.getElementById('cfg-folder').value.trim()
  };
}

async function runPdfExport(cfg) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({
    orientation: cfg.orientation,
    unit: 'mm',
    format: cfg.pageSize
  });
  const pageW = cfg.orientation === 'landscape' ? 297 : 210;
  const pageH = cfg.orientation === 'landscape' ? 210 : 297;
  const margin = 8;
  const slotH  = (pageH - (cfg.lociPerPage + 1) * margin) / cfg.lociPerPage;
  const slotW  = pageW - 2 * margin;

  let slotIdx = 0;
  const total = cfg.lociList.length;
  const times = [];

  for (let i = 0; i < total; i++) {
    if (pdfCancelled) { showToast('Export cancelled'); return; }
    const idx = cfg.lociList[i];
    updateProgress(i+1, total, idx, times);

    // Ensure data is loaded
    const data = await loadLocus(idx);
    if (!data) { slotIdx++; continue; }

    // Build temp render div
    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;top:-9999px;left:0;width:960px;background:#fff;';
    document.body.appendChild(tmp);
    tmp.appendChild(makePanelShell(manifest.loci.find(l=>l.index===idx) || {index:idx,locus_name:'Locus '+idx,chr:'?',start:0,end:0}));
    const panelEl = tmp.firstChild;
    fillPanel(data, panelEl);
    // Respect track toggles from dialog
    if (!cfg.inclCtx)   panelEl.querySelector('.ctx-section')?.remove();
    if (!cfg.inclGenes) panelEl.querySelector('.genes-section')?.remove();
    if (!cfg.inclLd)    panelEl.querySelector('.ld-section')?.remove();

    await new Promise(r => setTimeout(r, 50)); // let browser layout settle

    const t0 = Date.now();
    try {
      const canvas = await html2canvas(panelEl, {scale:1.5, useCORS:true});
      const imgData = canvas.toDataURL('image/png');
      const pageSlot = slotIdx % cfg.lociPerPage;
      if (pageSlot === 0 && slotIdx > 0) pdf.addPage();
      const yPos = margin + pageSlot * (slotH + margin);
      pdf.addImage(imgData, 'PNG', margin, yPos, slotW, slotH, undefined, 'FAST');
    } catch(e) { console.warn('html2canvas error locus', idx, e); }

    times.push(Date.now() - t0);
    document.body.removeChild(tmp);
    slotIdx++;
  }

  // Save
  updateProgress(total, total, -1, times);
  document.getElementById('progress-msg').textContent = 'Done! Saving file…';
  await new Promise(r => setTimeout(r, 400));

  if (cfg.folder) {
    try {
      const pdfData = pdf.output('datauristring');
      const r = await fetch(`${SERVER}/save-pdf`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({filename: cfg.filename, folder: cfg.folder, data: pdfData})
      });
      if (r.ok) { showToast(`PDF saved to ${cfg.folder}/${cfg.filename}`); return; }
    } catch(e) {}
  }
  pdf.save(cfg.filename);
  showToast('PDF download started');
}

function updateProgress(done, total, currentIdx, times) {
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progress-fill').style.width  = pct + '%';
  document.getElementById('progress-count').textContent = `${done} / ${total}`;
  const entry = currentIdx > 0 ? manifest.loci.find(l=>l.index===currentIdx) : null;
  document.getElementById('progress-msg').textContent =
    currentIdx > 0 ? `Rendering ${entry ? entry.locus_name : 'Locus '+currentIdx}…` : 'Finalising…';
  if (times.length > 2) {
    const avg = times.reduce((a,b)=>a+b,0) / times.length;
    const rem = Math.round((total - done) * avg / 1000);
    document.getElementById('progress-eta').textContent = `~${rem}s remaining`;
  }
}

// ═══════════════════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════════════════
function div(cls) { const d = document.createElement('div'); d.className = cls; return d; }

// Patch a locus_context ref whose start/end may be missing (old JSON files).
// Falls back to manifest which always carries start/end for every locus.
function resolveRef(ref) {
  if (!ref) return null;
  if (isFinite(+ref.start) && isFinite(+ref.end)) return ref;
  const entry = manifest && manifest.loci.find(l => l.index === ref.index);
  if (!entry) return ref;
  return Object.assign({}, ref, {start: entry.start, end: entry.end,
                                  chr: ref.chr || entry.chr});
}

function showToast(msg, ms=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  setTimeout(() => {
    t.style.opacity = '0'; setTimeout(() => { t.style.display='none'; }, 400);
  }, ms);
}

function fmtP(p) { return p == null || isNaN(p) ? '' : p.toExponential(2); }
function fmtN(n) { return (+n).toLocaleString(); }
function fmtBp(b) {
  b = +b;
  if (b >= 1e6) return (b/1e6).toFixed(2)+' Mb';
  if (b >= 1e3) return (b/1e3).toFixed(1)+' kb';
  return b.toLocaleString();
}
function fmtDist(b) {
  b = +b;
  if (b >= 1e6) return (b/1e6).toFixed(1)+' Mb';
  if (b >= 1e3) return (b/1e3).toFixed(0)+' kb';
  return b+' bp';
}

// ═══════════════════════════════════════════════════════════════
// Genome-wide skyline panel
// ═══════════════════════════════════════════════════════════════
const SKY_H = 130, SKY_ML = 40, SKY_MR = 16, SKY_MT = 6, SKY_MB = 18;
let _skyData = null, _skyRendered = false;

async function loadSkyline() {
  try {
    const res = await fetchWithTimeout(`${SERVER}/data/genome_skyline.json`, 2000);
    if (res.ok) { _skyData = await res.json(); return; }
  } catch(e) {}
  try {
    await loadScript(`${DATA_DIR}/genome_skyline.js`);
    if (window.GENOME_SKYLINE) _skyData = window.GENOME_SKYLINE;
  } catch(e) {}
}

function renderSkyline() {
  if (!_skyData) return;
  _skyRendered = true;
  const sd = _skyData;
  const svg = d3.select('#sky-svg');
  svg.selectAll('*').remove();

  const W = document.getElementById('genome-skyline').clientWidth - 32;
  const plotW = W - SKY_ML - SKY_MR;
  const plotH = SKY_H - SKY_MT - SKY_MB;
  svg.attr('width', W).attr('height', SKY_H);

  // Determine which chromosomes contain visible loci
  const activeChrSet = new Set();
  const visibleIndices = new Set();
  if (manifest && lociOrder.length) {
    const endPos = Math.min(currentStart + VISIBLE, lociOrder.length);
    for (let pos = currentStart; pos < endPos; pos++) {
      const idx = lociOrder[pos];
      visibleIndices.add(idx);
      const entry = manifest.loci.find(l => l.index === idx);
      if (entry) activeChrSet.add(String(entry.chr));
    }
  }

  // Build weighted piecewise x-scale: active chromosomes get 50% of plotW, rest get 50%
  const activeLen = sd.chromosomes.filter(c => activeChrSet.has(c.chr))
    .reduce((s, c) => s + c.length, 0);
  const inactiveLen = sd.chromosomes.filter(c => !activeChrSet.has(c.chr))
    .reduce((s, c) => s + c.length, 0);

  const activeW  = activeChrSet.size > 0 && inactiveLen > 0 ? plotW * 0.5 : (activeChrSet.size > 0 ? plotW : 0);
  const inactiveW = inactiveLen > 0 ? plotW - activeW : 0;

  // Compute per-chromosome pixel offset and width
  const chrLayout = [];
  let px = SKY_ML;
  sd.chromosomes.forEach(c => {
    const isActive = activeChrSet.has(c.chr);
    const pool = isActive ? activeLen : inactiveLen;
    const poolW = isActive ? activeW : inactiveW;
    const w = pool > 0 ? (c.length / pool) * poolW : 0;
    chrLayout.push({ ...c, px, pw: w, active: isActive });
    px += w;
  });

  // Build a piecewise scale: genome cumulative position → pixel
  function xSc(cumPos) {
    for (const cl of chrLayout) {
      if (cumPos >= cl.offset && cumPos <= cl.offset + cl.length) {
        const frac = (cumPos - cl.offset) / cl.length;
        return cl.px + frac * cl.pw;
      }
    }
    return SKY_ML;
  }
  // Inverse for click-to-navigate
  xSc.invert = function(pixel) {
    for (const cl of chrLayout) {
      if (pixel >= cl.px && pixel <= cl.px + cl.pw) {
        const frac = cl.pw > 0 ? (pixel - cl.px) / cl.pw : 0;
        return cl.offset + frac * cl.length;
      }
    }
    return 0;
  };

  const genomeLen = sd.genome_length;
  const binSize = genomeLen / sd.bin_count;
  const gwSig = -Math.log10(5e-8);
  const yMax = Math.min(50, Math.max(gwSig + 3, d3.max(sd.bins, d => d[1]) + 1));
  const ySc = d3.scaleLinear().domain([0, yMax]).range([SKY_MT + plotH, SKY_MT]);

  // Alternating chromosome density colors: dark green / blue
  const chrDensityColors = ['#166534', '#1e40af'];

  // Chromosome shading
  chrLayout.forEach((c, i) => {
    svg.append('rect')
      .attr('x', c.px).attr('y', SKY_MT)
      .attr('width', c.pw).attr('height', plotH)
      .attr('fill', i % 2 === 0 ? '#ffffff' : '#f0f1f4');
  });

  // Chromosome labels
  chrLayout.forEach(c => {
    if (c.pw < 8) return;
    svg.append('text')
      .attr('x', c.px + c.pw / 2).attr('y', SKY_MT + plotH + 13)
      .attr('text-anchor', 'middle').attr('font-size', c.active ? '10px' : '8px')
      .attr('fill', c.active ? '#1e293b' : '#94a3b8')
      .attr('font-weight', c.active ? '700' : '500')
      .text(c.chr);
  });

  // Significance line
  svg.append('line')
    .attr('x1', SKY_ML).attr('x2', SKY_ML + plotW)
    .attr('y1', ySc(gwSig)).attr('y2', ySc(gwSig))
    .attr('stroke', '#dc2626').attr('stroke-width', 1)
    .attr('stroke-dasharray', '6,3').attr('opacity', 0.7);
  svg.append('text')
    .attr('x', SKY_ML - 3).attr('y', ySc(gwSig) + 3)
    .attr('text-anchor', 'end').attr('font-size', '8px').attr('fill', '#dc2626')
    .text('5e-8');

  // Y-axis
  svg.append('text')
    .attr('transform', 'rotate(-90)')
    .attr('x', -(SKY_MT + plotH / 2)).attr('y', 11)
    .attr('text-anchor', 'middle').attr('font-size', '9px').attr('fill', '#64748b')
    .text('-log₁₀(P)');
  ySc.ticks(4).forEach(t => {
    svg.append('line')
      .attr('x1', SKY_ML - 3).attr('x2', SKY_ML)
      .attr('y1', ySc(t)).attr('y2', ySc(t))
      .attr('stroke', '#94a3b8').attr('stroke-width', 0.5);
    svg.append('text')
      .attr('x', SKY_ML - 5).attr('y', ySc(t) + 3)
      .attr('text-anchor', 'end').attr('font-size', '8px').attr('fill', '#94a3b8')
      .text(t);
  });

  // Density curve — per-chromosome with alternating colors
  const allBins = new Float64Array(sd.bin_count);
  sd.bins.forEach(b => { allBins[b[0]] = b[1]; });

  const area = d3.area()
    .x((d, i) => xSc((i + 0.5) * binSize))
    .y0(ySc(0)).y1(d => ySc(Math.min(d, yMax)))
    .curve(d3.curveMonotoneX);
  const line = d3.line()
    .x((d, i) => xSc((i + 0.5) * binSize))
    .y(d => ySc(Math.min(d, yMax)))
    .curve(d3.curveMonotoneX);

  // Draw density per chromosome with clip rects for alternating colors
  chrLayout.forEach((c, i) => {
    const col = chrDensityColors[i % 2];
    const clipId = 'sky-chr-clip-' + i;
    svg.append('defs').append('clipPath').attr('id', clipId)
      .append('rect').attr('x', c.px).attr('y', SKY_MT)
      .attr('width', c.pw).attr('height', plotH);
    const g = svg.append('g').attr('clip-path', `url(#${clipId})`);
    g.append('path').datum(allBins)
      .attr('fill', col).attr('opacity', 0.25).attr('d', area);
    g.append('path').datum(allBins)
      .attr('fill', 'none').attr('stroke', col).attr('stroke-width', 1.5).attr('d', line);
  });

  // Plot border
  svg.append('rect')
    .attr('x', SKY_ML).attr('y', SKY_MT)
    .attr('width', plotW).attr('height', plotH)
    .attr('fill', 'none').attr('stroke', '#cbd5e1').attr('stroke-width', 1);

  // Loci highlights
  if (manifest) {
    const allHL = [];
    manifest.loci.forEach(entry => {
      const ci = sd.chromosomes.findIndex(c => c.chr === String(entry.chr));
      if (ci < 0) return;
      const chrOff = sd.chromosomes[ci].offset;
      const x1 = xSc(chrOff + entry.start);
      const x2 = xSc(chrOff + entry.end);
      const xMid = (x1 + x2) / 2;
      const w = Math.max(4, x2 - x1);
      allHL.push({ entry, x1, x2, xMid, w, active: visibleIndices.has(entry.index) });
    });

    // Non-active yellow
    allHL.filter(h => !h.active).forEach(h => {
      svg.append('rect')
        .attr('x', h.x1 - (h.w - (h.x2 - h.x1)) / 2).attr('y', SKY_MT)
        .attr('width', h.w).attr('height', plotH)
        .attr('fill', '#fef9c3').attr('opacity', 0.6).attr('rx', 1);
    });

    // Active red
    allHL.filter(h => h.active).forEach((h, hi) => {
      svg.append('rect')
        .attr('x', h.x1 - (h.w - (h.x2 - h.x1)) / 2).attr('y', SKY_MT)
        .attr('width', h.w).attr('height', plotH)
        .attr('fill', '#fecaca').attr('opacity', 0.7).attr('rx', 1);
      svg.append('line')
        .attr('x1', h.xMid).attr('x2', h.xMid)
        .attr('y1', SKY_MT).attr('y2', SKY_MT + plotH)
        .attr('stroke', '#b91c1c').attr('stroke-width', 1.5);

      const labelY = SKY_MT + 10 + (hi % 2) * 12;
      const name = h.entry.locus_name || ('Locus ' + h.entry.index);
      const genes = (h.entry.nearest_genes || []).slice(0, 2).join(', ');
      const label = genes ? `${name} (${genes})` : name;
      svg.append('rect')
        .attr('x', h.xMid - 2).attr('y', labelY - 8)
        .attr('width', label.length * 5 + 6).attr('height', 11)
        .attr('fill', '#fff1f2').attr('rx', 2).attr('opacity', 0.92);
      svg.append('text')
        .attr('x', h.xMid + 1).attr('y', labelY)
        .attr('font-size', '8px').attr('font-weight', '700')
        .attr('fill', '#991b1b')
        .text(label);
    });
  }

  // Click-to-navigate + drag-to-create-locus
  const skyEl = document.getElementById('genome-skyline');
  let _dragStart = null, _dragRect = null;

  // Helper: find chromosome from cumulative genome position
  function cumPosToChr(cumPos) {
    for (const c of sd.chromosomes) {
      if (cumPos >= c.offset && cumPos <= c.offset + c.length)
        return { chr: c.chr, localPos: Math.round(cumPos - c.offset) };
    }
    return null;
  }

  skyEl.onmousedown = (e) => {
    const svgRect = document.getElementById('sky-svg').getBoundingClientRect();
    const mx = e.clientX - svgRect.left;
    if (mx < SKY_ML || mx > SKY_ML + plotW) return;
    _dragStart = { x: mx, clientX: e.clientX };

    // Create selection rectangle
    if (_dragRect) _dragRect.remove();
    _dragRect = svg.append('rect').attr('class','sky-select-rect')
      .attr('x', mx).attr('y', SKY_MT).attr('width', 0).attr('height', plotH)
      .attr('fill', '#3b82f6').attr('opacity', 0.2)
      .attr('stroke', '#2563eb').attr('stroke-width', 1).attr('stroke-dasharray', '4,2');
  };

  skyEl.onmousemove = (e) => {
    if (!_dragStart || !_dragRect) return;
    const svgRect = document.getElementById('sky-svg').getBoundingClientRect();
    const mx = Math.max(SKY_ML, Math.min(e.clientX - svgRect.left, SKY_ML + plotW));
    const x1 = Math.min(_dragStart.x, mx), x2 = Math.max(_dragStart.x, mx);
    _dragRect.attr('x', x1).attr('width', x2 - x1);
  };

  skyEl.onmouseup = (e) => {
    if (!_dragStart) return;
    const dragDist = Math.abs(e.clientX - _dragStart.clientX);
    const svgRect = document.getElementById('sky-svg').getBoundingClientRect();
    const mx = e.clientX - svgRect.left;

    if (_dragRect) _dragRect.remove();
    _dragRect = null;

    if (dragDist < 8) {
      // Click — navigate to nearest locus
      _dragStart = null;
      if (!manifest) return;
      const cumX = xSc.invert(mx);
      let bestDist = Infinity, bestIdx = -1;
      manifest.loci.forEach(loc => {
        const ci = sd.chromosomes.findIndex(c => c.chr === String(loc.chr));
        if (ci < 0) return;
        const mid = sd.chromosomes[ci].offset + (loc.start + loc.end) / 2;
        const d = Math.abs(mid - cumX);
        if (d < bestDist) { bestDist = d; bestIdx = loc.index; }
      });
      if (bestIdx > 0) {
        const pos = lociOrder.indexOf(bestIdx);
        if (pos >= 0) {
          currentStart = Math.max(0, Math.min(pos, lociOrder.length - VISIBLE));
          renderViewport(true);
        }
      }
    } else {
      // Drag — create new locus
      const x1 = Math.min(_dragStart.x, mx), x2 = Math.max(_dragStart.x, mx);
      const cum1 = xSc.invert(x1), cum2 = xSc.invert(x2);
      const info1 = cumPosToChr(cum1), info2 = cumPosToChr(cum2);
      _dragStart = null;
      if (!info1 || !info2) return;
      if (info1.chr !== info2.chr) {
        alert('Selection must be within a single chromosome.');
        return;
      }
      const selStart = Math.min(info1.localPos, info2.localPos);
      const selEnd = Math.max(info1.localPos, info2.localPos);
      const nextIdx = manifest ? manifest.total_loci + 1 : 1;
      showCreateLocusDialog(info1.chr, selStart, selEnd, 'Locus ' + nextIdx);
    }
  };

  skyEl.onmouseleave = () => {
    if (_dragRect) _dragRect.remove();
    _dragRect = null;
    _dragStart = null;
  };
}

function updateSkylineHighlights() {
  renderSkyline();
}

// ═══════════════════════════════════════════════════════════════
// Create new locus dialog
// ═══════════════════════════════════════════════════════════════
function showCreateLocusDialog(chr, start, end, defaultName) {
  const prev = document.getElementById('create-locus-dialog');
  if (prev) prev.remove();

  const dlg = document.createElement('div');
  dlg.id = 'create-locus-dialog';
  dlg.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;' +
    'background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:9999';

  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:10px;padding:24px 32px;width:380px;' +
    'box-shadow:0 8px 32px rgba(0,0,0,0.18);font-family:system-ui,sans-serif';

  box.innerHTML =
    '<h3 style="margin:0 0 16px;font-size:16px;color:#1e293b">Create New Locus</h3>' +
    '<div style="display:grid;grid-template-columns:80px 1fr;gap:8px 12px;align-items:center;font-size:13px">' +
      '<label style="color:#475569;font-weight:600">Name</label>' +
      '<input id="cl-name" type="text" value="' + defaultName + '" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px">' +
      '<label style="color:#475569;font-weight:600">Chromosome</label>' +
      '<input id="cl-chr" type="text" value="' + chr + '" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;background:#f1f5f9" readonly>' +
      '<label style="color:#475569;font-weight:600">Start</label>' +
      '<input id="cl-start" type="number" value="' + start + '" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px">' +
      '<label style="color:#475569;font-weight:600">End</label>' +
      '<input id="cl-end" type="number" value="' + end + '" style="padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px">' +
    '</div>' +
    '<p style="margin:12px 0 0;font-size:11px;color:#94a3b8">Region: chr' + chr + ':' + fmtN(start) + '–' + fmtN(end) + ' (' + fmtDist(end - start) + ')</p>' +
    '<p style="margin:8px 0 16px;font-size:12px;color:#64748b">' +
    'This will stream GWAS data, compute LD, and add the locus to the viewer. May take 5–15 seconds.</p>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end">' +
      '<button id="cl-cancel" style="padding:6px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:#475569">Cancel</button>' +
      '<button id="cl-confirm" style="padding:6px 16px;border:none;border-radius:6px;background:#1e40af;color:#fff;cursor:pointer;font-size:13px;font-weight:600">Create Locus</button>' +
    '</div>';

  dlg.appendChild(box);
  document.body.appendChild(dlg);

  document.getElementById('cl-cancel').onclick = () => dlg.remove();
  dlg.onclick = (e) => { if (e.target === dlg) dlg.remove(); };

  document.getElementById('cl-confirm').onclick = async () => {
    const btn = document.getElementById('cl-confirm');
    btn.textContent = 'Creating…';
    btn.disabled = true;
    btn.style.opacity = '0.6';

    const locusName = document.getElementById('cl-name').value.trim();
    const locChr    = document.getElementById('cl-chr').value.trim();
    const locStart  = parseInt(document.getElementById('cl-start').value);
    const locEnd    = parseInt(document.getElementById('cl-end').value);

    if (isNaN(locStart) || isNaN(locEnd) || locEnd <= locStart) {
      alert('Invalid start/end positions.');
      btn.textContent = 'Create Locus'; btn.disabled = false; btn.style.opacity = '';
      return;
    }

    try {
      const res = await fetch(SERVER + '/api/create-locus', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chr: locChr, start: locStart, end: locEnd, locus_name: locusName })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({error:'Server error'}));
        alert('Create failed: ' + (err.error || 'Unknown error'));
        btn.textContent = 'Create Locus'; btn.disabled = false; btn.style.opacity = '';
        return;
      }

      // Server returns updated manifest
      const newManifest = await res.json();
      manifest = newManifest;
      rebuildLociOrder();

      // Navigate to the new locus (last in the list)
      currentStart = Math.max(0, lociOrder.length - VISIBLE);

      // Update UI
      document.getElementById('cfg-total').textContent = lociOrder.length;
      document.getElementById('range-to').value = lociOrder.length;

      dlg.remove();
      renderViewport(true);

    } catch (e) {
      alert('Create failed: ' + e.message);
      btn.textContent = 'Create Locus'; btn.disabled = false; btn.style.opacity = '';
    }
  };
}

// ═══════════════════════════════════════════════════════════════
// Split locus dialog
// ═══════════════════════════════════════════════════════════════
function showSplitDialog(data) {
  const prev = document.getElementById('split-locus-dialog');
  if (prev) prev.remove();

  const dlg = document.createElement('div');
  dlg.id = 'split-locus-dialog';
  dlg.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;' +
    'background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:9999';

  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:12px;padding:24px 28px;width:620px;max-height:90vh;' +
    'overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.2);font-family:system-ui,sans-serif';

  const locStart = +data.start, locEnd = +data.end;
  const nextBase = manifest ? manifest.total_loci + 1 : 1;

  // State: list of split regions
  const splitRegions = [];

  box.innerHTML =
    '<h3 style="margin:0 0 4px;font-size:16px;color:#1e293b">Split Locus ' + data.locus_index + '</h3>' +
    '<p style="margin:0 0 12px;font-size:12px;color:#64748b">Chr' + data.chr + ':' + fmtN(locStart) + '–' + fmtN(locEnd) +
    ' &nbsp;·&nbsp; Drag on the density plot to define sub-regions, or add manually below.</p>' +
    '<div id="split-density-wrap" style="border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:12px"></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:12px">' +
      '<input id="split-start" type="number" placeholder="Start" style="flex:1;padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px">' +
      '<input id="split-end" type="number" placeholder="End" style="flex:1;padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px">' +
      '<button id="split-add-btn" style="padding:4px 12px;border:none;border-radius:4px;background:#1e40af;color:#fff;font-size:12px;font-weight:600;cursor:pointer">+ Add</button>' +
    '</div>' +
    '<div id="split-regions-list" style="margin-bottom:12px"></div>' +
    '<div id="split-validation" style="margin-bottom:12px"></div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;align-items:center">' +
      '<button id="split-validate-btn" style="padding:6px 14px;border:1px solid #2563eb;border-radius:6px;background:#eff6ff;cursor:pointer;font-size:12px;color:#1e40af;font-weight:600" disabled>Validate LD</button>' +
      '<span style="flex:1"></span>' +
      '<button id="split-cancel" style="padding:6px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;color:#475569">Cancel</button>' +
      '<button id="split-confirm" style="padding:6px 16px;border:none;border-radius:6px;background:#b91c1c;color:#fff;cursor:pointer;font-size:13px;font-weight:600" disabled>Split Locus</button>' +
    '</div>';

  dlg.appendChild(box);
  document.body.appendChild(dlg);

  // ── Draw density plot ──
  const snps = data.gwas_snps || [];
  const dWrap = document.getElementById('split-density-wrap');
  const dW = 564, dH = 100, dML = 40, dMR = 10, dMT = 6, dMB = 18;
  const dPlotW = dW - dML - dMR, dPlotH = dH - dMT - dMB;

  const dBins = 200;
  const binSize = (locEnd - locStart) / dBins;
  const bins = new Array(dBins).fill(0);
  snps.forEach(s => {
    if (s.pos < locStart || s.pos > locEnd) return;
    const bi = Math.min(dBins - 1, Math.floor((s.pos - locStart) / binSize));
    if (s.neg_log10_p > bins[bi]) bins[bi] = s.neg_log10_p;
  });
  const dYMax = Math.max(OV_THRESH_BLUE + 1.2, d3.max(bins) + 0.5);

  const dSvg = d3.select(dWrap).append('svg')
    .attr('width', dW).attr('height', dH).style('display', 'block');
  const dXSc = d3.scaleLinear().domain([locStart, locEnd]).range([dML, dML + dPlotW]);
  const dYSc = d3.scaleLinear().domain([0, dYMax]).range([dMT + dPlotH, dMT]);

  // Background
  dSvg.append('rect').attr('x', dML).attr('y', dMT)
    .attr('width', dPlotW).attr('height', dPlotH)
    .attr('fill', '#f8fafc');

  // Significance line
  dSvg.append('line').attr('x1', dML).attr('x2', dML + dPlotW)
    .attr('y1', dYSc(OV_THRESH_BLUE)).attr('y2', dYSc(OV_THRESH_BLUE))
    .attr('stroke', '#dc2626').attr('stroke-width', 1).attr('stroke-dasharray', '4,3');

  // Density
  const dArea = d3.area()
    .x((d, i) => dXSc(locStart + (i + 0.5) * binSize))
    .y0(dYSc(0)).y1(d => dYSc(Math.min(d, dYMax)))
    .curve(d3.curveBasis);
  dSvg.append('path').datum(bins)
    .attr('fill', '#6366f1').attr('opacity', 0.25).attr('d', dArea);
  const dLine = d3.line()
    .x((d, i) => dXSc(locStart + (i + 0.5) * binSize))
    .y(d => dYSc(Math.min(d, dYMax)))
    .curve(d3.curveBasis);
  dSvg.append('path').datum(bins)
    .attr('fill', 'none').attr('stroke', '#4338ca').attr('stroke-width', 1.3).attr('d', dLine);

  // X axis
  dSvg.append('g').attr('class', 'axis')
    .attr('transform', `translate(0,${dMT + dPlotH})`)
    .call(d3.axisBottom(dXSc).ticks(6).tickFormat(d => fmtBp(d)))
    .select('.domain').remove();

  // Regions overlay group (drawn on top)
  const regionsG = dSvg.append('g').attr('class', 'split-regions-overlay');

  // Border
  dSvg.append('rect').attr('x', dML).attr('y', dMT)
    .attr('width', dPlotW).attr('height', dPlotH)
    .attr('fill', 'none').attr('stroke', '#cbd5e1').attr('stroke-width', 1);

  // ── Drag-to-select on density ──
  let dragStart = null, dragRect = null;

  dSvg.on('mousedown', (e) => {
    const svgRect = dWrap.querySelector('svg').getBoundingClientRect();
    const mx = e.clientX - svgRect.left;
    if (mx < dML || mx > dML + dPlotW) return;
    dragStart = mx;
    dragRect = dSvg.append('rect')
      .attr('x', mx).attr('y', dMT).attr('width', 0).attr('height', dPlotH)
      .attr('fill', '#3b82f6').attr('opacity', 0.15)
      .attr('stroke', '#2563eb').attr('stroke-width', 1).attr('stroke-dasharray', '3,2');
  });

  dSvg.on('mousemove', (e) => {
    if (!dragStart || !dragRect) return;
    const svgRect = dWrap.querySelector('svg').getBoundingClientRect();
    const mx = Math.max(dML, Math.min(e.clientX - svgRect.left, dML + dPlotW));
    const x1 = Math.min(dragStart, mx), x2 = Math.max(dragStart, mx);
    dragRect.attr('x', x1).attr('width', x2 - x1);
  });

  dSvg.on('mouseup', (e) => {
    if (!dragStart) return;
    const svgRect = dWrap.querySelector('svg').getBoundingClientRect();
    const mx = Math.max(dML, Math.min(e.clientX - svgRect.left, dML + dPlotW));
    if (dragRect) dragRect.remove();
    dragRect = null;
    const dist = Math.abs(mx - dragStart);
    if (dist < 5) { dragStart = null; return; }
    const bp1 = Math.round(dXSc.invert(Math.min(dragStart, mx)));
    const bp2 = Math.round(dXSc.invert(Math.max(dragStart, mx)));
    dragStart = null;
    addRegion(Math.max(locStart, bp1), Math.min(locEnd, bp2));
  });

  // ── Region management ──
  function addRegion(start, end) {
    if (end <= start) return;
    const idx = splitRegions.length;
    const name = data.locus_name ? data.locus_name + ' (' + String.fromCharCode(65 + idx) + ')' :
      'Locus ' + (nextBase + idx);
    splitRegions.push({ name, start, end });
    renderRegionsList();
    renderRegionsOverlay();
    updateConfirmBtn();
  }

  function removeRegion(idx) {
    splitRegions.splice(idx, 1);
    renderRegionsList();
    renderRegionsOverlay();
    updateConfirmBtn();
  }

  const regionColors = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#dc2626', '#0891b2'];

  function renderRegionsOverlay() {
    regionsG.selectAll('*').remove();
    splitRegions.forEach((r, i) => {
      const x1 = dXSc(r.start), x2 = dXSc(r.end);
      const col = regionColors[i % regionColors.length];
      regionsG.append('rect')
        .attr('x', x1).attr('y', dMT).attr('width', x2 - x1).attr('height', dPlotH)
        .attr('fill', col).attr('opacity', 0.15)
        .attr('stroke', col).attr('stroke-width', 1.5);
      regionsG.append('text')
        .attr('x', (x1 + x2) / 2).attr('y', dMT + 12)
        .attr('text-anchor', 'middle').attr('font-size', '9px')
        .attr('font-weight', '700').attr('fill', col)
        .text(String.fromCharCode(65 + i));
    });
  }

  function renderRegionsList() {
    const list = document.getElementById('split-regions-list');
    if (!splitRegions.length) {
      list.innerHTML = '<p style="font-size:12px;color:#94a3b8;margin:0;text-align:center">No regions defined yet. Drag on the plot or use the inputs above.</p>';
      return;
    }
    list.innerHTML = splitRegions.map((r, i) => {
      const col = regionColors[i % regionColors.length];
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f8fafc;border-radius:4px;margin-bottom:4px">' +
        '<span style="width:18px;height:18px;border-radius:3px;background:' + col + ';color:#fff;' +
        'font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">' +
        String.fromCharCode(65 + i) + '</span>' +
        '<input type="text" value="' + r.name.replace(/"/g, '&quot;') + '" data-ri="' + i + '" class="split-name-input" ' +
        'style="flex:1;padding:3px 6px;border:1px solid #d1d5db;border-radius:3px;font-size:12px">' +
        '<span style="font-size:11px;color:#475569;white-space:nowrap">' + fmtN(r.start) + ' – ' + fmtN(r.end) + '</span>' +
        '<span style="font-size:10px;color:#94a3b8">(' + fmtDist(r.end - r.start) + ')</span>' +
        '<button data-ri="' + i + '" class="split-rm-btn" style="border:none;background:none;color:#dc2626;' +
        'cursor:pointer;font-size:14px;font-weight:700;padding:0 4px" title="Remove">×</button>' +
        '</div>';
    }).join('');

    list.querySelectorAll('.split-name-input').forEach(inp => {
      inp.addEventListener('change', () => {
        splitRegions[+inp.dataset.ri].name = inp.value;
      });
    });
    list.querySelectorAll('.split-rm-btn').forEach(btn => {
      btn.addEventListener('click', () => removeRegion(+btn.dataset.ri));
    });
  }

  function updateConfirmBtn() {
    const enough = splitRegions.length >= 2;
    document.getElementById('split-confirm').disabled = !enough;
    document.getElementById('split-validate-btn').disabled = !enough;
    // Clear validation when regions change
    document.getElementById('split-validation').innerHTML = '';
  }

  renderRegionsList();

  // Validate LD button
  document.getElementById('split-validate-btn').addEventListener('click', async () => {
    const vBtn = document.getElementById('split-validate-btn');
    const vDiv = document.getElementById('split-validation');
    vBtn.textContent = 'Checking…';
    vBtn.disabled = true;

    // Read final names
    document.querySelectorAll('.split-name-input').forEach(inp => {
      splitRegions[+inp.dataset.ri].name = inp.value;
    });

    try {
      const res = await fetch(SERVER + '/api/validate-split', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          locus_index: data.locus_index,
          regions: splitRegions.map(r => ({ name: r.name, start: r.start, end: r.end }))
        })
      });
      const vr = await res.json();

      if (vr.valid) {
        vDiv.innerHTML = '<div style="padding:8px 12px;background:#f0fdf4;border:1px solid #bbf7d0;' +
          'border-radius:6px;font-size:12px;color:#166534;font-weight:600">' +
          '&#10003; Validation passed — no cross-region LD above r² = ' + vr.split_ld_threshold +
          ', min distance ' + fmtN(vr.split_min_distance_bp) + ' bp met.</div>';
      } else {
        let html = '<div style="padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;' +
          'border-radius:6px;font-size:12px;color:#991b1b">';
        html += '<div style="font-weight:700;margin-bottom:4px">&#9888; Validation warnings</div>';
        vr.warnings.forEach(w => {
          html += '<div style="margin-bottom:2px">• ' + w + '</div>';
        });
        if (vr.ld_violations && vr.ld_violations.length > 0) {
          html += '<div style="margin-top:6px;font-size:11px;color:#7f1d1d">';
          html += '<table style="width:100%;border-collapse:collapse;font-size:11px">';
          html += '<tr style="border-bottom:1px solid #fecaca"><th style="text-align:left;padding:2px 4px">SNP A</th>' +
            '<th style="text-align:left;padding:2px 4px">SNP B</th>' +
            '<th style="text-align:left;padding:2px 4px">r²</th>' +
            '<th style="text-align:left;padding:2px 4px">Regions</th></tr>';
          vr.ld_violations.slice(0, 10).forEach(v => {
            const colA = regionColors[v.region_a % regionColors.length];
            const colB = regionColors[v.region_b % regionColors.length];
            html += '<tr><td style="padding:2px 4px">' + v.snp_a + '</td>' +
              '<td style="padding:2px 4px">' + v.snp_b + '</td>' +
              '<td style="padding:2px 4px;font-weight:700">' + v.r2.toFixed(3) + '</td>' +
              '<td style="padding:2px 4px">' +
              '<span style="color:' + colA + ';font-weight:700">' + String.fromCharCode(65 + v.region_a) + '</span>' +
              ' ↔ <span style="color:' + colB + ';font-weight:700">' + String.fromCharCode(65 + v.region_b) + '</span></td></tr>';
          });
          if (vr.ld_violations.length > 10) {
            html += '<tr><td colspan="4" style="padding:2px 4px;color:#94a3b8">… and ' +
              (vr.ld_violations.length - 10) + ' more</td></tr>';
          }
          html += '</table></div>';
        }
        html += '</div>';
        vDiv.innerHTML = html;
      }
    } catch (e) {
      vDiv.innerHTML = '<div style="padding:6px 12px;background:#fef2f2;border:1px solid #fecaca;' +
        'border-radius:6px;font-size:12px;color:#991b1b">Validation failed: ' + e.message + '</div>';
    }

    vBtn.textContent = 'Validate LD';
    vBtn.disabled = splitRegions.length < 2;
  });

  // Manual add button
  document.getElementById('split-add-btn').addEventListener('click', () => {
    const s = parseInt(document.getElementById('split-start').value);
    const e = parseInt(document.getElementById('split-end').value);
    if (isNaN(s) || isNaN(e) || e <= s) { alert('Invalid start/end.'); return; }
    addRegion(s, e);
    document.getElementById('split-start').value = '';
    document.getElementById('split-end').value = '';
  });

  // Cancel
  document.getElementById('split-cancel').onclick = () => dlg.remove();
  dlg.onclick = (e) => { if (e.target === dlg) dlg.remove(); };

  // Confirm
  document.getElementById('split-confirm').onclick = async () => {
    const btn = document.getElementById('split-confirm');
    btn.textContent = 'Splitting…';
    btn.disabled = true;
    btn.style.opacity = '0.6';

    // Read final names from inputs
    document.querySelectorAll('.split-name-input').forEach(inp => {
      splitRegions[+inp.dataset.ri].name = inp.value;
    });

    try {
      const res = await fetch(SERVER + '/api/split-locus', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          locus_index: data.locus_index,
          regions: splitRegions.map(r => ({ name: r.name, start: r.start, end: r.end }))
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({error:'Server error'}));
        alert('Split failed: ' + (err.error || 'Unknown error'));
        btn.textContent = 'Split Locus'; btn.disabled = false; btn.style.opacity = '';
        return;
      }

      const newManifest = await res.json();
      manifest = newManifest;
      rebuildLociOrder();
      locusCache.delete(data.locus_index);
      document.getElementById('cfg-total').textContent = lociOrder.length;
      document.getElementById('range-to').value = lociOrder.length;

      // Navigate to first new locus
      const firstNew = newManifest.loci[newManifest.loci.length - splitRegions.length];
      if (firstNew) {
        const pos = lociOrder.indexOf(firstNew.index);
        if (pos >= 0) currentStart = Math.max(0, Math.min(pos, lociOrder.length - VISIBLE));
      }

      dlg.remove();
      renderViewport(true);

    } catch (e) {
      alert('Split failed: ' + e.message);
      btn.textContent = 'Split Locus'; btn.disabled = false; btn.style.opacity = '';
    }
  };
}

// ═══════════════════════════════════════════════════════════════
// Locus boundary update — inline server call
// ═══════════════════════════════════════════════════════════════
async function triggerLocusUpdate(locusIndex, newStart, newEnd, origStart, origEnd, btn) {
  btn.textContent = 'Updating…';
  btn.disabled = true;
  btn.style.opacity = '0.6';

  try {
    const res = await fetch(SERVER + '/api/update-locus', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({locus_index: locusIndex, new_start: newStart, new_end: newEnd})
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({error: 'Server error'}));
      alert('Update failed: ' + (err.error || 'Unknown error'));
      btn.textContent = 'Update Locus';
      btn.disabled = false;
      btn.style.opacity = '';
      return;
    }

    const newData = await res.json();
    // Update caches
    locusCache.set(locusIndex, newData);
    if (window.LOCUS_DATA) window.LOCUS_DATA[locusIndex] = newData;

    // Update manifest entry so header and skyline reflect new boundaries
    if (manifest) {
      const entry = manifest.loci.find(l => l.index === locusIndex);
      if (entry) { entry.start = newStart; entry.end = newEnd; }
    }

    // Re-render the viewport
    renderViewport(false);

  } catch (e) {
    alert('Update failed: ' + e.message);
    btn.textContent = 'Update Locus';
    btn.disabled = false;
    btn.style.opacity = '';
  }
}

// ═══════════════════════════════════════════════════════════════
init();
</script>
