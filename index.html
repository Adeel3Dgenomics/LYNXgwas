<script>
// ═══════════════════════════════════════════════════════════════
// Constants & State
// ═══════════════════════════════════════════════════════════════
const SERVER    = 'http://localhost:8765';
const DATA_DIR  = 'data';
const VISIBLE   = 3;
const MARGIN    = {top:10, right:20, bottom:28, left:52};
const PLOT_H    = 250;
const GENE_ROW  = 40;
const LD_H      = 70;
const CTX_H     = 70;
const GW_SIG    = -Math.log10(5e-8);   // 7.30
const SUG_SIG   = -Math.log10(1e-5);   // 5.0
const OV_THRESH_BLUE  = -Math.log10(5e-8);
const OV_THRESH_GREEN = -Math.log10(5e-5);
const OV_H      = 72;
const OV_BINS   = 300;
const LDT_CELL_PX_DEFAULT = 6;   // default triangle cell size in px
const LDT_AXIS_H          = 44;  // height of x-axis below triangle

// LD color scheme per spec
function ldColor(r2) {
  if (r2 < 0)    return '#AAAAAA';
  if (r2 >= 0.8) return '#E41A1C';
  if (r2 >= 0.6) return '#FF7F00';
  if (r2 >= 0.4) return '#4DAF4A';
  if (r2 >= 0.2) return '#377EB8';
  return '#AAAAAA';
}
const LD_LEGEND = [
  ['r²≥0.8','#E41A1C'],['0.6–0.8','#FF7F00'],
  ['0.4–0.6','#4DAF4A'],['0.2–0.4','#377EB8'],
  ['<0.2','#AAAAAA'],['Top SNP','#7c3aed']
];

let manifest    = null;
let currentStart = 0;  // position in lociOrder array (0-based)
let lociOrder = [];    // sorted array of locus indices from manifest

function rebuildLociOrder() {
  if (manifest && manifest.loci) {
    lociOrder = manifest.loci.map(l => l.index).sort((a, b) => a - b);
  }
}
const locusCache = new Map();
let showCtx    = true;
let showGenes  = true;
let showLd     = true;
let showLdTri  = true;
let pdfCancelled = false;

// Handle r2 field name change (old JSON: "r2", new JSON: "r2_with_index")
function snpR2(s) {
  const v = s.r2_with_index !== undefined ? s.r2_with_index : s.r2;
  return (v !== undefined && v !== null) ? v : -1;
}

// ═══════════════════════════════════════════════════════════════
// Data loading — server first, .js fallback
// ═══════════════════════════════════════════════════════════════
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${CSS.escape ? src : src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve;
    s.onerror = () => reject(new Error(`Failed: ${src}`));
    document.head.appendChild(s);
  });
}

async function loadManifest() {
  // Try HTTP server
  try {
    const res = await fetchWithTimeout(`${SERVER}/manifest`, 1500);
    if (res.ok) return await res.json();
  } catch(e) {}
  // Fall back to .js
  await loadScript(`${DATA_DIR}/manifest.js`);
  if (window.MANIFEST) return window.MANIFEST;
  throw new Error('Could not load manifest from server or data/manifest.js');
}

function sanitizeJsonText(text) {
  return text
    .replace(/,\s*,/g, ',')
    .replace(/,\s*,/g, ',')
    .replace(/\[\s*,/g, '[')
    .replace(/,\s*\]/g, ']');
}

function sanitizeLdMatrix(data) {
  if (!data || !data.ld_triangle || !data.ld_triangle.matrix) return;
  const m = data.ld_triangle.matrix;
  const N = data.ld_triangle.snp_count || data.ld_triangle.snps.length;
  for (let i = 0; i < m.length; i++) {
    if (!m[i]) continue;
    if (m[i].length > N) {
      // Row is a sparse array from double-comma serialization bug.
      // Extract only actually-present values (skip holes), not by index.
      const dense = [];
      for (let j = 0; j < m[i].length && dense.length < N; j++) {
        if (j in m[i]) dense.push(m[i][j]);
      }
      m[i] = dense;
    }
  }
}

async function loadLocus(idx) {
  if (locusCache.has(idx)) return locusCache.get(idx);
  let data = null;
  // Try HTTP server — fetch raw text so we can sanitize double-comma artifacts
  try {
    const res = await fetchWithTimeout(`${SERVER}/locus/${idx}`, 2000);
    if (res.ok) {
      const raw = await res.text();
      data = JSON.parse(sanitizeJsonText(raw));
    }
  } catch(e) {}
  // Fallback to .js (parsed by the browser — sanitize sparse arrays in memory)
  if (!data) {
    try {
      await loadScript(`${DATA_DIR}/locus_${idx}.js`);
      data = window.LOCUS_DATA && window.LOCUS_DATA[idx];
      if (data) sanitizeLdMatrix(data);
    } catch(e) {}
  }
  if (data) {
    // Assertion: verify LD matrix integrity after sanitization
    const tri = data.ld_triangle;
    if (tri && tri.snps && tri.matrix) {
      const N = tri.snps.length;
      if (tri.matrix.length !== N)
        console.error(`[LD] Locus ${idx}: matrix has ${tri.matrix.length} rows but ${N} SNPs`);
      for (let r = 0; r < Math.min(3, tri.matrix.length); r++) {
        if (tri.matrix[r] && tri.matrix[r].length !== N)
          console.error(`[LD] Locus ${idx}: row ${r} has ${tri.matrix[r].length} cols, expected ${N}`);
      }
    }
    locusCache.set(idx, data);
  }
  return data;
}

function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), ms);
  return fetch(url, {signal: ctrl.signal});
}

// ═══════════════════════════════════════════════════════════════
// Bootstrap
// ═══════════════════════════════════════════════════════════════
let _skipLoading = false;
function skipLoading() {
  _skipLoading = true;
  document.getElementById('loading-overlay').style.display = 'none';
}

async function init() {
  const overlay = document.getElementById('loading-overlay');
  // Hide overlay immediately — only show if server is running but pipeline not done
  overlay.style.display = 'none';

  let manifestOk = false;
  try { manifest = await loadManifest(); manifestOk = true; } catch(e) {}

  if (!manifestOk) {
    // Check if the Java server is running at all
    let serverUp = false;
    try {
      const r = await fetchWithTimeout(`${SERVER}/progress`, 3000);
      serverUp = r && r.ok;
    } catch(e) {}

    if (serverUp) {
      // Server is up but pipeline is still running — show loading overlay and poll
      _skipLoading = false;
      overlay.style.display = 'flex';

      while (!_skipLoading && !manifestOk) {
        try {
          const r = await fetchWithTimeout(`${SERVER}/progress`, 3000);
          if (r && r.ok) {
            const p = await r.json();
            document.getElementById('loading-phase').textContent = p.phase || 'Processing…';
            document.getElementById('loading-sub').textContent   =
              p.total > 0 ? `Locus ${p.locus} / ${p.total}` : '';
            document.getElementById('loading-fill').style.width  = (p.pct || 0) + '%';
            document.getElementById('loading-count').textContent =
              p.total > 0 ? `${p.pct || 0}% complete` : '';
            if (p.done) {
              try { manifest = await loadManifest(); rebuildLociOrder(); manifestOk = true; } catch(e2) {}
            }
          }
        } catch(e) {}
        if (!manifestOk) await new Promise(r => setTimeout(r, 2000));
      }
      overlay.style.display = 'none';
    }
  }

  if (!manifestOk) {
    document.getElementById('panels-container').innerHTML =
      `<div style="padding:48px;text-align:center;color:#94a3b8">
        <strong style="color:#f87171">Could not load manifest</strong><br><br>
        Run the Java backend first:<br>
        <code>java -cp bin Main --config config.properties</code><br><br>
        Then open <code>output/index.html</code> (or the server URL printed by the tool).
      </div>`;
    document.getElementById('nav-counter').textContent = 'Error';
    return;
  }

  rebuildLociOrder();
  document.getElementById('cfg-total').textContent = lociOrder.length;
  document.getElementById('range-to').value = lociOrder.length;

  setupSearch();
  setupToggles();
  setupNav();
  setupPdfDialog();

  // Load and render genome skyline (non-blocking)
  loadSkyline().then(() => { renderSkyline(); updateSkylineHighlights(); });

  renderViewport(false);
  // Preload next batch
  preload(currentStart + VISIBLE);
}

// ═══════════════════════════════════════════════════════════════
// Viewport rendering
// ═══════════════════════════════════════════════════════════════
async function renderViewport(animate) {
  const container = document.getElementById('panels-container');

  if (animate) {
    container.classList.add('transitioning');
    await new Promise(r => setTimeout(r, 200));
  }

  container.innerHTML = '';

  // Clamp currentStart
  currentStart = Math.max(0, Math.min(currentStart, lociOrder.length - VISIBLE));

  const endPos = Math.min(currentStart + VISIBLE, lociOrder.length);
  for (let pos = currentStart; pos < endPos; pos++) {
    const idx = lociOrder[pos];
    const entry  = manifest.loci.find(l => l.index === idx);
    const panel  = makePanelShell(entry || {index: idx, locus_name:'Locus '+idx, chr:'?', start:0, end:0});
    container.appendChild(panel);
    loadLocus(idx).then(data => { if (data) fillPanel(data, panel); });
  }

  updateNavUI();
  updateSkylineHighlights();

  if (animate) {
    container.classList.remove('transitioning');
  }

  // Preload next + prev not yet cached
  if (currentStart + VISIBLE < lociOrder.length) preload(lociOrder[currentStart + VISIBLE]);
  if (currentStart > 0) preload(lociOrder[currentStart - 1]);
}

function preload(idx) {
  if (idx >= 1 && idx <= manifest.total_loci && !locusCache.has(idx)) {
    loadLocus(idx); // fire-and-forget
  }
}

function makePanelShell(entry) {
  const d = document.createElement('div');
  d.className = 'locus-panel';
  d.id = `panel-${entry.index}`;
  d.innerHTML = `
    <div class="locus-header">
      <div class="lh-title">${entry.locus_name}  —  Chr${entry.chr}:${fmtN(entry.start)}–${fmtN(entry.end)}</div>
      <div class="lh-ops">
        <button class="lh-op-btn lh-split-btn" data-idx="${entry.index}" title="Split this locus">Split</button>
      </div>
      <div class="lh-genes"></div>
      <div class="lh-top">Loading…</div>
    </div>
    <div class="plot-loading">Loading data…</div>`;
  d.querySelector('.lh-split-btn').addEventListener('click', () => {
    const data = locusCache.get(entry.index);
    if (data) showSplitDialog(data);
    else alert('Locus data not loaded yet.');
  });
  return d;
}

function fillPanel(data, panelEl) {
  panelEl.querySelector('.plot-loading')?.remove();

  // Update header
  const genes = (data.nearest_genes || []).join(', ');
  panelEl.querySelector('.lh-genes').textContent = genes ? `Nearest: ${genes}` : '';
  if (data.top_snp) {
    panelEl.querySelector('.lh-top').innerHTML =
      `Top SNP: <strong>${data.top_snp.id}</strong>&nbsp; p = ${fmtP(data.top_snp.pvalue)}`;
  } else {
    panelEl.querySelector('.lh-top').textContent = 'No SNPs';
  }

  const hasSnps  = data.gwas_snps && data.gwas_snps.length > 0;
  const hasGenes = data.genes && data.genes.length > 0;
  // hasLdData = any SNP (including top SNP) has an r2 value; used to decide whether to render LD bar section
  const hasLdData = hasSnps;
  // hasRealLD = at least one NON-top SNP has real r2 (not just the top-SNP fallback r2=1)
  const hasRealLD = hasSnps && data.gwas_snps.some(s => {
    const r = snpR2(s);
    return r >= 0 && r <= 1 && (!data.top_snp || s.id !== data.top_snp.id);
  });
  const hasLdTri  = !!(data.ld_triangle && data.ld_triangle.snps && data.ld_triangle.matrix);

  if (!hasRealLD) {
    panelEl.insertAdjacentHTML('beforeend',
      `<div class="warning-banner">⚠ No LD data — re-run pipeline with ld.enabled=true + ref.panel in config</div>`);
  }

  // Shared x scale
  const totalW  = Math.max(panelEl.clientWidth - 28, 400);
  const xRange  = [MARGIN.left, totalW - MARGIN.right];
  let   xScale  = d3.scaleLinear().domain([data.padded_start, data.padded_end]).range(xRange);

  // ── Overview density strip ──
  const ovWrap = div('overview-wrap');
  panelEl.appendChild(ovWrap);
  renderOverviewDensity(ovWrap, data, totalW + MARGIN.right);

  // ── B: Context sketch ──
  const ctxWrap = div('ctx-wrap ctx-section' + (showCtx ? '' : ' hidden'));
  panelEl.appendChild(ctxWrap);
  renderContextSketch(ctxWrap, data, totalW + MARGIN.right);

  // ── Gene biotype filter ──
  const allBiotypes = new Set();
  if (hasGenes) data.genes.forEach(g => allBiotypes.add(geneBiotype(g)));
  const visibleBiotypes = new Set(allBiotypes);

  let gfBar = null;
  if (hasGenes) {
    gfBar = div('gene-filter genes-section' + (showGenes ? '' : ' hidden'));
    const totalGenes = data.genes.length;
    const mkChk = (id, label, bt, checked) => {
      const lbl = document.createElement('label');
      const inp = document.createElement('input');
      inp.type = 'checkbox'; inp.checked = checked; inp.id = id;
      inp.setAttribute('data-bt', bt);
      lbl.appendChild(inp);
      lbl.appendChild(document.createTextNode(' ' + label));
      return lbl;
    };
    gfBar.appendChild(mkChk('gf-pc-'+data.locus_index,'Protein-coding','protein_coding',true));
    const ncTypes = [...allBiotypes].filter(b => b !== 'protein_coding');
    ncTypes.forEach(bt => {
      const nice = bt === 'lncRNA' ? 'lncRNA' : bt === 'other' ? 'Other non-coding' : bt;
      gfBar.appendChild(mkChk('gf-'+bt+'-'+data.locus_index, nice, bt, true));
    });
    const btnAll = document.createElement('button');
    btnAll.className = 'gf-quick'; btnAll.textContent = 'All';
    btnAll.addEventListener('click', () => { gfBar.querySelectorAll('input[data-bt]').forEach(i => i.checked = true); applyFilter(); });
    gfBar.appendChild(btnAll);
    const btnPC = document.createElement('button');
    btnPC.className = 'gf-quick'; btnPC.textContent = 'Protein-coding only';
    btnPC.addEventListener('click', () => { gfBar.querySelectorAll('input[data-bt]').forEach(i => { i.checked = i.dataset.bt === 'protein_coding'; }); applyFilter(); });
    gfBar.appendChild(btnPC);

    // Separator + exonic SNP highlight toggle
    const sep = document.createElement('span');
    sep.className = 'gf-sep';
    gfBar.appendChild(sep);
    const exLbl = document.createElement('label');
    exLbl.style.cssText = 'display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600;color:#7c3aed';
    const exInp = document.createElement('input');
    exInp.type = 'checkbox'; exInp.id = 'gf-exonic-' + data.locus_index;
    exLbl.appendChild(exInp);
    exLbl.appendChild(document.createTextNode('Exonic SNPs'));
    gfBar.appendChild(exLbl);
    exInp.addEventListener('change', () => {
      const svg = plotWrap.querySelector('.main-svg');
      if (svg) svg.classList.toggle('exonic-mode', exInp.checked);
    });

    const countSpan = document.createElement('span');
    countSpan.className = 'gf-count';
    gfBar.appendChild(countSpan);
    panelEl.appendChild(gfBar);
  }

  // ── Plot wrapper (C + D + E share one SVG) ──
  const plotWrap = div('plot-wrap');
  const dlBtn = document.createElement('button');
  dlBtn.className = 'dl-png-btn'; dlBtn.textContent = '↓ PNG';
  dlBtn.addEventListener('click', () => downloadPng(panelEl, data.locus_name));
  plotWrap.appendChild(dlBtn);
  panelEl.appendChild(plotWrap);

  const svgW = totalW + MARGIN.right;
  let geneRows = [];
  let svgH, yScale;

  function buildSvg() {
    // Remove previous SVG + LD triangle (but keep dlBtn)
    plotWrap.querySelectorAll('.main-svg, .ldt-scroll-outer').forEach(el => el.remove());
    plotWrap.querySelectorAll('.connector-overlay').forEach(el => el.remove());

    // Filter genes
    const visGenes = hasGenes && showGenes
      ? data.genes.filter(g => visibleBiotypes.has(geneBiotype(g)))
      : [];
    geneRows = visGenes.length ? layoutGenes(visGenes, xScale) : [];

    // Update count (genes + exonic SNPs)
    if (gfBar) {
      const cs = gfBar.querySelector('.gf-count');
      if (cs) {
        const exIntervals = buildExonIntervals(data.genes);
        const exCount = (data.gwas_snps || []).filter(s => isExonic(s.pos, exIntervals)).length;
        cs.textContent = `${visGenes.length}/${data.genes.length} genes · ${exCount} exonic SNPs`;
      }
    }

    const nRows    = geneRows.length;
    const geneH    = nRows > 0 ? nRows * GENE_ROW + 16 : 0;
    const ldTrackH = showLd && hasLdData ? LD_H + 16 : 0;
    svgH = MARGIN.top + PLOT_H + MARGIN.bottom + geneH + ldTrackH + 4;

    const svg = d3.select(plotWrap).append('svg')
      .attr('class', 'main-svg')
      .attr('viewBox', `0 0 ${svgW} ${svgH}`)
      .attr('preserveAspectRatio', 'xMidYMid meet');

    // ── C: Manhattan ──
    const yMax = hasSnps
      ? Math.max(GW_SIG + 2, d3.max(data.gwas_snps, s => s.neg_log10_p) + 1)
      : GW_SIG + 3;
    yScale = d3.scaleLinear().domain([0, yMax]).range([MARGIN.top + PLOT_H, MARGIN.top]);

    const gMH = svg.append('g').attr('class', 'mh-group');
    renderManhattan(gMH, data, xScale, yScale);

    const xAxisG = svg.append('g').attr('class','axis')
      .attr('transform', `translate(0,${MARGIN.top + PLOT_H})`)
      .call(d3.axisBottom(xScale).ticks(8).tickFormat(d => fmtBp(d)));
    xAxisG.select('.domain').remove();

    let curY = MARGIN.top + PLOT_H + MARGIN.bottom;

    // ── D: Gene track (filtered + repacked) ──
    if (visGenes.length > 0) {
      const gGene = svg.append('g')
        .attr('class', 'gene-group-root genes-section')
        .attr('transform', `translate(0,${curY})`);
      renderGeneTrack(gGene, visGenes, geneRows, xScale, nRows * GENE_ROW + 16);
      curY += geneH;
    }

    // ── E: LD bar track ──
    if (showLd && hasLdData) {
      const gLd = svg.append('g')
        .attr('class', 'ld-section')
        .attr('transform', `translate(0,${curY})`);
      renderLdTrack(gLd, data.gwas_snps, xScale, LD_H, data.top_snp);
      curY += ldTrackH;
    }

    // ── Scroll-wheel zoom ──
    const xBase = d3.scaleLinear().domain([data.padded_start, data.padded_end]).range(xRange);
    const zoom = d3.zoom().scaleExtent([1, 500])
      .translateExtent([[xRange[0], -Infinity],[xRange[1], Infinity]])
      .on('zoom', ({transform}) => {
        xScale = transform.rescaleX(xBase);
        xAxisG.call(d3.axisBottom(xScale).ticks(8).tickFormat(d => fmtBp(d)));
        xAxisG.select('.domain').remove();
        redrawOnZoom(svg, data, xScale, yScale, geneRows, visGenes,
          visGenes.length > 0 && showGenes, hasLdData && showLd);
        if (hasLdTri) {
          const scrollW = plotWrap.querySelector('.ldt-inner-scroll');
          if (scrollW) requestAnimationFrame(() =>
            drawConnectors(plotWrap, data.ld_triangle, data, xScale, yScale,
                           svgW, svgH, scrollW, scrollW._cs || (data.ld_triangle.cell_size_px || LDT_CELL_PX_DEFAULT)));
        }
      });
    svg.call(zoom);

    // Reapply exonic-mode if checkbox is checked
    const exChk = gfBar && gfBar.querySelector('#gf-exonic-' + data.locus_index);
    if (exChk && exChk.checked) svg.node().classList.add('exonic-mode');

    return svg;
  }

  function applyFilter() {
    visibleBiotypes.clear();
    if (gfBar) gfBar.querySelectorAll('input[type=checkbox]').forEach(i => {
      if (i.checked) visibleBiotypes.add(i.dataset.bt);
    });
    buildSvg();
    // Rebuild LD triangle connectors
    if (hasLdTri) {
      plotWrap.querySelectorAll('.ldt-scroll-outer').forEach(el => el.remove());
      const ldtDiv = div('ldt-scroll-outer ldt-section' + (showLdTri ? '' : ' hidden'));
      plotWrap.appendChild(ldtDiv);
      renderLdTriangle(ldtDiv, data.ld_triangle, data, xScale, yScale, svgW, svgH, plotWrap);
    }
  }

  if (gfBar) {
    gfBar.querySelectorAll('input[type=checkbox]').forEach(i =>
      i.addEventListener('change', applyFilter));
  }

  buildSvg();

  // ── F: LD triangle heatmap (separate scrollable panel below main SVG) ──
  if (showLdTri && hasLdTri) {
    const ldtDiv = div('ldt-scroll-outer ldt-section' + (showLdTri ? '' : ' hidden'));
    plotWrap.appendChild(ldtDiv);
    renderLdTriangle(ldtDiv, data.ld_triangle, data, xScale, yScale, svgW, svgH, plotWrap);
  }

  // ── LD legend ──
  if (hasRealLD) {
    const leg = div('ld-legend');
    LD_LEGEND.forEach(([label, col]) => {
      leg.innerHTML += `<span class="ld-swatch" style="background:${col}"></span>${label}&nbsp;&nbsp;`;
    });
    panelEl.appendChild(leg);
  }

  // Handle toggle visibility via data attribute
  panelEl.dataset.hasLd    = hasLdData ? '1' : '0';
  panelEl.dataset.hasGenes = hasGenes  ? '1' : '0';
}

// ═══════════════════════════════════════════════════════════════
// Panel B — Context sketch (schematic, not to scale)
// ═══════════════════════════════════════════════════════════════
function renderContextSketch(wrap, data, totalW) {
  const ctx = data.locus_context || {};
  const svg = d3.select(wrap).append('svg')
    .attr('viewBox', `0 0 ${totalW} ${CTX_H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  const y      = CTX_H / 2;
  const boxW   = 120;
  const gap    = 60;
  const totalBoxW = 3 * boxW + 2 * gap;
  const startX = (totalW - totalBoxW) / 2;

  // Three equal-width rectangles — resolve start/end from manifest when missing
  const boxes = [
    {x: startX,              ref: resolveRef(ctx.prev_locus), isCurrent: false, side: 'left'},
    {x: startX + boxW + gap, ref: null,                        isCurrent: true,  side: null},
    {x: startX + 2*(boxW+gap), ref: resolveRef(ctx.next_locus), isCurrent: false, side: 'right'}
  ];

  // Connecting lines
  svg.append('line')
    .attr('x1', startX + boxW).attr('x2', startX + boxW + gap)
    .attr('y1', y).attr('y2', y)
    .attr('stroke','#cbd5e1').attr('stroke-width',1.5);
  svg.append('line')
    .attr('x1', startX + 2*boxW + gap).attr('x2', startX + 2*(boxW+gap))
    .attr('y1', y).attr('y2', y)
    .attr('stroke','#cbd5e1').attr('stroke-width',1.5);

  boxes.forEach(b => {
    const bx = b.x, bw = boxW, bh = 20;
    if (b.isCurrent) {
      // Current locus — filled red
      svg.append('rect').attr('x',bx).attr('y',y-bh/2)
        .attr('width',bw).attr('height',bh).attr('rx',3)
        .attr('fill','#E41A1C').attr('opacity',.85);
      svg.append('text').attr('x',bx+bw/2).attr('y',y+5)
        .attr('text-anchor','middle').attr('font-size',10).attr('font-weight','bold')
        .attr('fill','#fff').text(data.locus_name);
      // Coords below
      svg.append('text').attr('x',bx+bw/2).attr('y',y+bh/2+12)
        .attr('text-anchor','middle').attr('font-size',9).attr('fill','#64748b')
        .text(`Chr${data.chr}:${fmtBp(data.start)}–${fmtBp(data.end)}`);
    } else if (b.ref) {
      // Neighbour locus — outlined grey
      svg.append('rect').attr('x',bx).attr('y',y-bh/2)
        .attr('width',bw).attr('height',bh).attr('rx',3)
        .attr('fill','none').attr('stroke','#94a3b8').attr('stroke-width',1.5);
      svg.append('text').attr('x',bx+bw/2).attr('y',y+4)
        .attr('text-anchor','middle').attr('font-size',9).attr('fill','#64748b')
        .text(`Locus ${b.ref.index}`);
      // Coords below (cross-chromosome: show only "Chr N" label)
      const diffChr = b.ref.distance_bp > 1e15;
      const coordLabel = diffChr
        ? `Chr${b.ref.chr}`
        : `Chr${b.ref.chr}:${fmtBp(b.ref.start)}–${fmtBp(b.ref.end)}`;
      svg.append('text').attr('x',bx+bw/2).attr('y',y+bh/2+12)
        .attr('text-anchor','middle').attr('font-size',8).attr('fill','#94a3b8')
        .text(coordLabel);
      // Distance label in gap
      const distLabel = diffChr ? 'diff chr' : fmtDist(b.ref.distance_bp);
      const gapMidX = b.side === 'left'
        ? startX + boxW + gap / 2
        : startX + 2*boxW + gap + gap / 2;
      svg.append('text').attr('x',gapMidX).attr('y',y-bh/2-4)
        .attr('text-anchor','middle').attr('font-size',9).attr('fill','#94a3b8')
        .text(distLabel);
      // Arrow
      const arrowX = b.side === 'left' ? gapMidX - 6 : gapMidX + 6;
      svg.append('text').attr('x',arrowX).attr('y',y+3)
        .attr('text-anchor','middle').attr('font-size',11).attr('fill','#cbd5e1')
        .text(b.side === 'left' ? '◀' : '▶');
    } else {
      // No neighbour — placeholder
      svg.append('rect').attr('x',bx).attr('y',y-bh/2)
        .attr('width',bw).attr('height',bh).attr('rx',3)
        .attr('fill','none').attr('stroke','#e2e8f0').attr('stroke-width',1)
        .attr('stroke-dasharray','4,3');
      svg.append('text').attr('x',bx+bw/2).attr('y',y+4)
        .attr('text-anchor','middle').attr('font-size',9).attr('fill','#cbd5e1')
        .text(b.side === 'left' ? '▕ (start)' : '(end) ▏');
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// Overview density strip  (above context sketch)
// ═══════════════════════════════════════════════════════════════
function renderOverviewDensity(wrap, data, totalW) {
  const snps = data.gwas_snps;
  if (!snps || !snps.length) return;

  const topPos  = data.top_snp ? data.top_snp.pos : Math.round((+data.start + +data.end) / 2);
  const winHalf = 1_000_000;
  const xMin    = topPos - winHalf;
  const xMax    = topPos + winHalf;

  // Bin SNPs → max -log10(p) per bin
  const bins    = new Array(OV_BINS).fill(0);
  const binSize = (xMax - xMin) / OV_BINS;
  snps.forEach(s => {
    if (s.pos < xMin || s.pos > xMax) return;
    const bi = Math.min(OV_BINS - 1, Math.floor((s.pos - xMin) / binSize));
    if (s.neg_log10_p > bins[bi]) bins[bi] = s.neg_log10_p;
  });

  const yMax  = Math.max(OV_THRESH_BLUE + 1.2, d3.max(bins) + 0.5);
  const mL    = MARGIN.left, mR = MARGIN.right, mT = 6, mB = 16;
  const plotW = totalW - mL - mR;
  const plotH = OV_H - mT - mB;

  const xSc = d3.scaleLinear().domain([xMin, xMax]).range([mL, mL + plotW]);
  const ySc = d3.scaleLinear().domain([0, yMax]).range([mT + plotH, mT]);

  const svgSel = d3.select(wrap).append('svg')
    .attr('viewBox', `0 0 ${totalW} ${OV_H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  // Clip path
  const clipId = 'ov-clip-' + (data.locus_index || Math.random().toString(36).slice(2));
  svgSel.append('defs').append('clipPath').attr('id', clipId)
    .append('rect').attr('x', mL).attr('y', mT).attr('width', plotW).attr('height', plotH);

  // ── Highlighted locus regions ──
  const ctx     = data.locus_context || {};
  const prevRef = resolveRef(ctx.prev_locus);
  const nextRef = resolveRef(ctx.next_locus);

  const drawRegion = (start, end, color, opacity) => {
    const s = +start, e = +end;
    if (!isFinite(s) || !isFinite(e)) return;
    const rx1 = Math.max(xSc(s), mL);
    const rx2 = Math.min(xSc(e), mL + plotW);
    if (rx2 <= rx1) return;
    svgSel.append('rect')
      .attr('x', rx1).attr('y', mT)
      .attr('width', rx2 - rx1).attr('height', plotH)
      .attr('fill', color).attr('opacity', opacity);
  };
  // Previous and next loci — muted indigo
  if (prevRef) drawRegion(prevRef.start, prevRef.end, '#6366f1', 0.15);
  if (nextRef) drawRegion(nextRef.start, nextRef.end, '#6366f1', 0.15);

  // Current locus — draggable region with handles
  let curStart = +data.start, curEnd = +data.end;
  const locRect = svgSel.append('rect').attr('class','locus-drag-region')
    .attr('y', mT).attr('height', plotH)
    .attr('fill', '#E41A1C').attr('opacity', 0.18);
  const handleW = 4, handleColor = '#b91c1c';
  const leftHandle = svgSel.append('rect').attr('class','locus-handle-left')
    .attr('y', mT).attr('width', handleW).attr('height', plotH)
    .attr('fill', handleColor).attr('opacity', 0.7).attr('cursor','ew-resize');
  const rightHandle = svgSel.append('rect').attr('class','locus-handle-right')
    .attr('y', mT).attr('width', handleW).attr('height', plotH)
    .attr('fill', handleColor).attr('opacity', 0.7).attr('cursor','ew-resize');
  const leftLabel = svgSel.append('text').attr('class','locus-label-left')
    .attr('y', mT + plotH + 13).attr('font-size', 7).attr('fill', '#991b1b')
    .attr('text-anchor','middle');
  const rightLabel = svgSel.append('text').attr('class','locus-label-right')
    .attr('y', mT + plotH + 13).attr('font-size', 7).attr('fill', '#991b1b')
    .attr('text-anchor','middle');

  function updateLocusRegion() {
    const rx1 = Math.max(xSc(curStart), mL), rx2 = Math.min(xSc(curEnd), mL + plotW);
    locRect.attr('x', rx1).attr('width', Math.max(0, rx2 - rx1));
    leftHandle.attr('x', rx1 - handleW / 2);
    rightHandle.attr('x', rx2 - handleW / 2);
    leftLabel.attr('x', rx1).text(fmtBp(curStart));
    rightLabel.attr('x', rx2).text(fmtBp(curEnd));
  }
  updateLocusRegion();

  // Show/hide update button in the locus header
  function toggleUpdateBtn() {
    const changed = curStart !== +data.start || curEnd !== +data.end;
    const panel = wrap.closest('.locus-panel');
    if (!panel) return;
    let btn = panel.querySelector('.locus-update-btn');
    if (changed && !btn) {
      btn = document.createElement('button');
      btn.className = 'locus-update-btn';
      btn.textContent = 'Update Locus';
      btn.addEventListener('click', () => {
        triggerLocusUpdate(data.locus_index, curStart, curEnd, +data.start, +data.end, btn);
      });
      const titleEl = panel.querySelector('.lh-title');
      if (titleEl) titleEl.after(btn);
    } else if (!changed && btn) {
      btn.remove();
    } else if (changed && btn) {
      // Update click handler with latest boundaries
      btn.replaceWith(btn.cloneNode(true));
      btn = panel.querySelector('.locus-update-btn');
      btn.addEventListener('click', () => {
        triggerLocusUpdate(data.locus_index, curStart, curEnd, +data.start, +data.end, btn);
      });
    }
  }

  // Drag behavior for handles
  function makeDrag(side) {
    return d3.drag().on('drag', (ev) => {
      const bp = Math.round(xSc.invert(ev.x));
      if (side === 'left') {
        curStart = Math.max(xMin, Math.min(bp, curEnd - 1000));
      } else {
        curEnd = Math.min(xMax, Math.max(bp, curStart + 1000));
      }
      updateLocusRegion();
    }).on('end', () => {
      toggleUpdateBtn();
    });
  }
  leftHandle.call(makeDrag('left'));
  rightHandle.call(makeDrag('right'));

  // ── Plot border ──
  svgSel.append('rect')
    .attr('x', mL).attr('y', mT)
    .attr('width', plotW).attr('height', plotH)
    .attr('fill', 'none').attr('stroke', '#e5e7eb').attr('stroke-width', 1);

  // ── Threshold lines ──
  svgSel.append('line')
    .attr('x1', mL).attr('x2', mL + plotW)
    .attr('y1', ySc(OV_THRESH_BLUE)).attr('y2', ySc(OV_THRESH_BLUE))
    .attr('stroke', '#3b82f6').attr('stroke-width', 1).attr('stroke-dasharray', '4,3');
  svgSel.append('line')
    .attr('x1', mL).attr('x2', mL + plotW)
    .attr('y1', ySc(OV_THRESH_GREEN)).attr('y2', ySc(OV_THRESH_GREEN))
    .attr('stroke', '#22c55e').attr('stroke-width', 1).attr('stroke-dasharray', '4,3');

  // Threshold labels (right edge, outside clip)
  svgSel.append('text').attr('x', mL + plotW + 2).attr('y', ySc(OV_THRESH_BLUE) + 3)
    .attr('font-size', 8).attr('fill', '#3b82f6').text('5×10⁻⁸');
  svgSel.append('text').attr('x', mL + plotW + 2).attr('y', ySc(OV_THRESH_GREEN) + 3)
    .attr('font-size', 8).attr('fill', '#22c55e').text('5×10⁻⁵');

  // ── Density area + line (clipped) ──
  const g = svgSel.append('g').attr('clip-path', `url(#${clipId})`);

  const area = d3.area()
    .x((d, i) => xSc(xMin + (i + 0.5) * binSize))
    .y0(ySc(0)).y1(d => ySc(Math.max(0, d)))
    .curve(d3.curveBasis);

  const line = d3.line()
    .x((d, i) => xSc(xMin + (i + 0.5) * binSize))
    .y(d => ySc(Math.max(0, d)))
    .curve(d3.curveBasis);

  g.append('path').datum(bins)
    .attr('fill', '#6366f1').attr('opacity', 0.22).attr('d', area);
  g.append('path').datum(bins)
    .attr('fill', 'none').attr('stroke', '#4f46e5').attr('stroke-width', 1.3).attr('d', line);

  // Top SNP vertical marker
  if (data.top_snp) {
    g.append('line')
      .attr('x1', xSc(data.top_snp.pos)).attr('x2', xSc(data.top_snp.pos))
      .attr('y1', mT).attr('y2', mT + plotH)
      .attr('stroke', '#7c3aed').attr('stroke-width', 1.5)
      .attr('stroke-dasharray', '3,2').attr('opacity', 0.8);
  }

  // ── X-axis (minimal) ──
  svgSel.append('g').attr('class', 'axis')
    .attr('transform', `translate(0,${mT + plotH})`)
    .call(d3.axisBottom(xSc).ticks(6).tickFormat(d => fmtBp(d)))
    .select('.domain').remove();

  // ── Y-axis label ──
  svgSel.append('text')
    .attr('transform', 'rotate(-90)')
    .attr('x', -(mT + plotH / 2)).attr('y', 10)
    .attr('text-anchor', 'middle').attr('font-size', 8).attr('fill', '#94a3b8')
    .text('−log₁₀P');
}

// ═══════════════════════════════════════════════════════════════
// Panel C — Manhattan plot
// ═══════════════════════════════════════════════════════════════
function renderManhattan(g, data, xScale, yScale) {
  const snps  = data.gwas_snps || [];
  const topId = data.top_snp ? data.top_snp.id : null;
  const x1 = xScale.range()[0], x2 = xScale.range()[1];

  // Locus boundary highlight
  const lx1 = Math.max(xScale(data.start), x1);
  const lx2 = Math.min(xScale(data.end), x2);
  if (lx2 > lx1) {
    g.append('rect').attr('class','locus-region')
      .attr('x', lx1).attr('y', yScale.range()[1])
      .attr('width', lx2 - lx1).attr('height', yScale.range()[0] - yScale.range()[1])
      .attr('fill','#fef9c3').attr('opacity', 0.5);
  }

  // Y axis
  g.append('g').attr('class','axis').attr('transform',`translate(${MARGIN.left},0)`)
    .call(d3.axisLeft(yScale).ticks(5));
  g.append('text').attr('transform','rotate(-90)')
    .attr('x',-(MARGIN.top + PLOT_H/2)).attr('y',13)
    .attr('text-anchor','middle').attr('font-size',10).attr('fill','#6b7280')
    .text('−log₁₀(P)');

  // Significance lines
  const gwY = yScale(GW_SIG), sugY = yScale(SUG_SIG);
  g.append('line').attr('class','gw-line')
    .attr('x1',x1).attr('x2',x2).attr('y1',gwY).attr('y2',gwY)
    .attr('stroke','#dc2626').attr('stroke-dasharray','6,4').attr('stroke-width',1);
  g.append('text').attr('x',x2-4).attr('y',gwY-3)
    .attr('text-anchor','end').attr('font-size',9).attr('fill','#dc2626').text('5×10⁻⁸');
  g.append('line').attr('class','sug-line')
    .attr('x1',x1).attr('x2',x2).attr('y1',sugY).attr('y2',sugY)
    .attr('stroke','#3b82f6').attr('stroke-dasharray','4,3').attr('stroke-width',1);
  g.append('text').attr('x',x2-4).attr('y',sugY-3)
    .attr('text-anchor','end').attr('font-size',9).attr('fill','#3b82f6').text('1×10⁻⁵');

  if (!snps.length) {
    g.append('text').attr('x',(x1+x2)/2).attr('y',yScale(GW_SIG/2))
      .attr('text-anchor','middle').attr('font-size',12).attr('fill','#cbd5e1')
      .text('No SNPs in region'); return;
  }

  const tip = document.getElementById('tooltip');

  // Regular SNP circles (tagged exonic/non-exonic for filter)
  const _exons = buildExonIntervals(data.genes);
  g.selectAll('.snp-circle')
    .data(snps.filter(s => s.id !== topId))
    .join('circle')
    .attr('class', s => 'snp-circle' + (isExonic(s.pos, _exons) ? ' snp-exonic' : ''))
    .attr('cx', s => xScale(s.pos)).attr('cy', s => yScale(s.neg_log10_p))
    .attr('r', 3.5).attr('fill', s => ldColor(snpR2(s)))
    .attr('stroke','#fff').attr('stroke-width',.4).attr('opacity',.92)
    .on('mouseover',(ev,s) => showTip(tip,ev,s))
    .on('mousemove',(ev)   => moveTip(tip,ev))
    .on('mouseout', ()     => hideTip(tip));

  // Top SNP — purple diamond, 1.5× larger
  const top = snps.find(s => s.id === topId);
  if (top) {
    const tx = xScale(top.pos), ty = yScale(top.neg_log10_p), r = 8;
    g.append('path').attr('class','top-snp-diamond')
      .datum(top)
      .attr('d',`M${tx},${ty-r} L${tx+r},${ty} L${tx},${ty+r} L${tx-r},${ty}Z`)
      .attr('fill','#7c3aed').attr('stroke','#fff').attr('stroke-width',1.5)
      .on('mouseover',(ev,s) => showTip(tip,ev,s))
      .on('mousemove',(ev)   => moveTip(tip,ev))
      .on('mouseout', ()     => hideTip(tip));
  }
}

// ═══════════════════════════════════════════════════════════════
// Panel D — Gene track
// ═══════════════════════════════════════════════════════════════
function layoutGenes(genes, xScale) {
  const sorted = [...genes].sort((a,b) => a.start - b.start);
  const rows = [];
  sorted.forEach(gene => {
    let placed = false;
    for (let r = 0; r < rows.length; r++) {
      const last = rows[r][rows[r].length-1];
      const labelPx = last.gene_name.length * 6.5;
      if (xScale(gene.start) > xScale(last.end) + labelPx + 10) {
        rows[r].push(gene); gene._row = r; placed = true; break;
      }
    }
    if (!placed) { gene._row = rows.length; rows.push([gene]); }
  });
  return rows;
}

function renderGeneTrack(g, genes, rows, xScale, trackH) {
  g.append('line').attr('x1',MARGIN.left).attr('x2',xScale.range()[1])
    .attr('y1',0).attr('y2',0).attr('stroke','#e5e7eb').attr('stroke-width',1);
  g.append('text').attr('x',8).attr('y',14).attr('font-size',9).attr('fill','#94a3b8')
    .text('Genes');

  const tip = document.getElementById('tooltip');
  genes.forEach(gene => {
    const row   = gene._row || 0;
    const gy    = 18 + row * GENE_ROW;
    const gx1   = xScale(gene.start), gx2 = xScale(gene.end);
    const coding = gene.transcripts && gene.transcripts.some(t =>
      t.transcript_type === 'protein_coding');
    const gColor = coding ? '#2171B5' : '#238B45';
    const tx = canonicalTx(gene);

    const gg = g.append('g').attr('class','gene-gfx').datum(gene);
    // Label
    gg.append('text').attr('x',Math.max(gx1,MARGIN.left)).attr('y',gy-3)
      .attr('font-size',10).attr('font-style','italic').attr('font-weight','600')
      .attr('fill',gColor).text(gene.gene_name);

    if (!tx) {
      drawIntron(gg, gx1, gx2, gy+8, gColor, gene.strand);
      return;
    }
    // Intron backbone
    drawIntron(gg, xScale(tx.start), xScale(tx.end), gy+8, gColor, tx.strand);
    // Exons
    tx.exons.forEach(e => {
      const w = Math.max(1, xScale(e.end)-xScale(e.start));
      gg.append('rect').attr('x',xScale(e.start)).attr('y',gy+4)
        .attr('width',w).attr('height',8).attr('fill',gColor).attr('opacity',.65);
    });
    // CDS (taller, full opacity)
    tx.cds.forEach(c => {
      const w = Math.max(1, xScale(c.end)-xScale(c.start));
      gg.append('rect').attr('x',xScale(c.start)).attr('y',gy+2)
        .attr('width',w).attr('height',12).attr('fill',gColor);
    });
    // UTRs (shorter, outlined)
    tx.utrs.forEach(u => {
      const w = Math.max(1, xScale(u.end)-xScale(u.start));
      gg.append('rect').attr('x',xScale(u.start)).attr('y',gy+6)
        .attr('width',w).attr('height',4)
        .attr('fill',gColor).attr('opacity',.4);
    });
    // Hover target
    gg.append('rect')
      .attr('x',Math.max(gx1,MARGIN.left)).attr('y',gy-5)
      .attr('width',Math.max(1,gx2-Math.max(gx1,MARGIN.left))).attr('height',24)
      .attr('fill','transparent')
      .on('mouseover',(ev,d) => {
        tip.querySelector('.tt-id').textContent   = d.gene_name;
        tip.querySelector('.tt-pos').textContent  = d.gene_id;
        tip.querySelector('.tt-pval').textContent = tx.transcript_type;
        tip.querySelector('.tt-r2').textContent   =
          `Chr${d.chr}:${fmtN(d.start)}–${fmtN(d.end)} (${d.strand})`;
        tip.style.display = 'block'; moveTip(tip,ev);
      })
      .on('mousemove',(ev) => moveTip(tip,ev))
      .on('mouseout', ()   => hideTip(tip));
  });
}

function drawIntron(g, x1, x2, y, color, strand) {
  g.append('line').attr('x1',x1).attr('x2',x2).attr('y1',y).attr('y2',y)
    .attr('stroke',color).attr('stroke-width',1.5).attr('opacity',.5);
  const dir = strand === '-' ? -1 : 1;
  for (let ax = x1 + 40; ax < x2 - 6; ax += 50) {
    g.append('path')
      .attr('d',`M${ax},${y-3} L${ax+4*dir},${y} L${ax},${y+3}`)
      .attr('fill','none').attr('stroke',color).attr('stroke-width',1).attr('opacity',.6);
  }
}

function canonicalTx(gene) {
  if (!gene.transcripts || !gene.transcripts.length) return null;
  const coding = gene.transcripts.filter(t => t.transcript_type === 'protein_coding');
  const pool   = coding.length ? coding : gene.transcripts;
  return pool.reduce((b,t) => (!b || t.end-t.start > b.end-b.start) ? t : b, null);
}

function buildExonIntervals(genes) {
  const intervals = [];
  if (!genes) return intervals;
  genes.forEach(g => {
    if (!g.transcripts) return;
    g.transcripts.forEach(tx => {
      if (tx.transcript_type !== 'protein_coding') return;
      (tx.exons || []).forEach(e => intervals.push([+e.start, +e.end]));
      (tx.cds || []).forEach(e => intervals.push([+e.start, +e.end]));
    });
  });
  intervals.sort((a, b) => a[0] - b[0]);
  // Merge overlapping
  const merged = [];
  for (const iv of intervals) {
    if (merged.length && iv[0] <= merged[merged.length - 1][1]) {
      merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], iv[1]);
    } else {
      merged.push([iv[0], iv[1]]);
    }
  }
  return merged;
}

function isExonic(pos, mergedExons) {
  let lo = 0, hi = mergedExons.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (pos < mergedExons[mid][0]) hi = mid - 1;
    else if (pos > mergedExons[mid][1]) lo = mid + 1;
    else return true;
  }
  return false;
}

function geneBiotype(gene) {
  if (!gene.transcripts || !gene.transcripts.length) return 'other';
  if (gene.transcripts.some(t => t.transcript_type === 'protein_coding')) return 'protein_coding';
  const types = new Set(gene.transcripts.map(t => t.transcript_type));
  if (types.has('lncRNA') || types.has('lincRNA')) return 'lncRNA';
  if (types.has('miRNA'))  return 'miRNA';
  if (types.has('pseudogene') || [...types].some(t => t && t.includes('pseudogene'))) return 'pseudogene';
  if (types.has('antisense')) return 'antisense';
  return 'other';
}

// ═══════════════════════════════════════════════════════════════
// Panel E — LD bar track
// ═══════════════════════════════════════════════════════════════
function renderLdTrack(g, snps, xScale, trackH, topSnp) {
  g.append('line').attr('x1',MARGIN.left).attr('x2',xScale.range()[1])
    .attr('y1',0).attr('y2',0).attr('stroke','#e5e7eb').attr('stroke-width',1);
  g.append('text').attr('x',8).attr('y',14).attr('font-size',9).attr('fill','#94a3b8')
    .text('LD r²');

  const ldY = d3.scaleLinear().domain([0,1]).range([trackH,2]);
  const ldSnps = snps.filter(s => snpR2(s) >= 0);
  const barW = Math.max(1, (xScale.range()[1]-xScale.range()[0]) / (ldSnps.length||1) * 0.9);

  ldSnps.forEach(s => {
    const r2 = snpR2(s);
    const bx = xScale(s.pos) - barW/2;
    const by = ldY(r2);
    const isTop = topSnp && s.id === topSnp.id;
    g.append('rect').attr('x',bx).attr('y',by)
      .attr('width',barW).attr('height',trackH - by + 2)
      .attr('fill', ldColor(r2))
      .attr('stroke', isTop ? '#7c3aed' : 'none')
      .attr('stroke-width', isTop ? 1.5 : 0);
  });

  // Y axis
  g.append('g').attr('class','axis').attr('transform',`translate(${MARGIN.left},0)`)
    .call(d3.axisLeft(ldY).ticks(3).tickFormat(d3.format('.1f')));
}

// ═══════════════════════════════════════════════════════════════
// Panel F — LD triangle heatmap (canvas-based, scrollable)
// ═══════════════════════════════════════════════════════════════
function renderLdTriangle(wrap, ldData, data, xScale, yScale, svgW, svgH, plotWrap) {
  if (!ldData || !ldData.snps || !ldData.matrix) return;
  const N = ldData.snp_count || ldData.snps.length;
  if (N < 2) return;

  // Auto-compute cell size to fill the available width (same content area as Manhattan plot)
  const availW = svgW - MARGIN.left - MARGIN.right;
  const autoCs = Math.max(3, Math.floor(availW / N));
  let cs = autoCs;
  let scaleType = 'continuous';
  let showBlocks = true, closeBlockTops = false, shadeBlocks = false, labelBlocks = false;
  const bp = {strongR2:0.70, recomR2:0.30, propThreshold:0.90, minInformPairs:3, minBlockSize:3};
  let ldBlocks = detectLdBlocks(ldData.matrix, N, bp);

  // ── Row 1: rendering controls ──
  const hdr = div('ldt-header');
  const csMax = Math.max(autoCs + 4, 16);
  hdr.innerHTML =
    `<span style="font-size:9px;color:#94a3b8;line-height:22px">LD r² (pairwise) · ${N} SNPs</span>` +
    `<span style="font-size:9px;color:#64748b;margin-left:auto;display:flex;align-items:center;gap:8px">` +
    `<label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:9px">` +
      `<input type="checkbox" class="ldt-haploview-chk"> Haploview</label>` +
    `Cell&thinsp;<input type="range" min="3" max="${csMax}" value="${cs}" class="ldt-cell-slider" style="width:56px;cursor:pointer">` +
    `<span class="ldt-cell-val">${cs}px</span></span>`;
  wrap.appendChild(hdr);

  // ── Row 2: block detection controls ──
  const brow = div('ldt-header');
  brow.style.flexWrap = 'wrap';
  brow.innerHTML =
    `<label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:9px">` +
      `<input type="checkbox" class="ldt-showblocks" checked> LD blocks</label>` +
    `<label style="font-size:9px;display:flex;align-items:center;gap:2px">Strong r²≥` +
      `<input type="range" min="0.3" max="1.0" step="0.05" value="0.70" class="ldt-strong" style="width:48px">` +
      `<span class="ldt-strong-val">0.70</span></label>` +
    `<label style="font-size:9px;display:flex;align-items:center;gap:2px">Recom r²≤` +
      `<input type="range" min="0.0" max="0.7" step="0.05" value="0.30" class="ldt-recom" style="width:48px">` +
      `<span class="ldt-recom-val">0.30</span></label>` +
    `<label style="font-size:9px;display:flex;align-items:center;gap:2px">Prop≥` +
      `<input type="range" min="0.5" max="1.0" step="0.05" value="0.90" class="ldt-prop" style="width:48px">` +
      `<span class="ldt-prop-val">90%</span></label>` +
    `<label style="font-size:9px;display:flex;align-items:center;gap:2px">Min` +
      `<input type="number" min="2" max="20" value="3" class="ldt-minblk" ` +
      `style="width:36px;padding:1px 3px;border:1px solid #d1d5db;border-radius:3px;font-size:9px"></label>` +
    `<label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:9px">` +
      `<input type="checkbox" class="ldt-closetops"> Tops</label>` +
    `<label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:9px">` +
      `<input type="checkbox" class="ldt-shade"> Shade</label>` +
    `<label style="display:flex;align-items:center;gap:3px;cursor:pointer;font-size:9px">` +
      `<input type="checkbox" class="ldt-labels"> Labels</label>`;
  wrap.appendChild(brow);

  // ── Block status line ──
  const bstat = div('');
  Object.assign(bstat.style, {fontSize:'9px', color:'#64748b', padding:'0 14px 4px'});
  wrap.appendChild(bstat);

  function updateBlockStatus() {
    if (!showBlocks || ldBlocks.length === 0) {
      bstat.textContent = showBlocks ? 'No blocks detected' : '';
      return;
    }
    const largest = Math.max(...ldBlocks.map(b => b.snpCount));
    const d = ldBlocks[0].diag;
    bstat.textContent = `${ldBlocks.length} blocks · largest ${largest} SNPs` +
      ` · block 1: ${d.strong}S/${d.recom}R/${d.uninform}U prop=${(d.prop*100).toFixed(0)}%`;
  }
  updateBlockStatus();

  // ── Scrollable container (canvas + axis share horizontal scroll) ──
  const scrollWrap = div('ldt-inner-scroll');
  Object.assign(scrollWrap.style, {overflowX:'auto', overflowY:'hidden', position:'relative'});
  wrap.appendChild(scrollWrap);

  const triInner = div('ldt-tri-inner');
  Object.assign(triInner.style, {
    display:'inline-block', verticalAlign:'top',
    paddingLeft: MARGIN.left + 'px', paddingRight: MARGIN.right + 'px'
  });
  scrollWrap.appendChild(triInner);

  const canvas = document.createElement('canvas');
  canvas.className = 'ldt-triangle-canvas';
  canvas.style.display = 'block';
  triInner.appendChild(canvas);

  const axisSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  axisSvg.style.display = 'block';
  triInner.appendChild(axisSvg);

  // ── Legend SVG (fixed right, outside scroll) ──
  wrap.style.position = 'relative';
  const legSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  Object.assign(legSvg.style, {
    position:'absolute', right:'6px', top:'28px',
    width:'22px', height:'120px', zIndex:'2', pointerEvents:'none'
  });
  wrap.appendChild(legSvg);

  // ── Build / rebuild triangle ──
  function buildTri(cellPx) {
    scrollWrap._cs  = cellPx;
    canvas._cellPx  = cellPx;
    drawLdTriangle(canvas, ldData.snps, ldData.matrix, cellPx, scaleType,
      showBlocks ? ldBlocks : null, {closeBlockTops, shadeBlocks, labelBlocks});
    drawTriangleAxis(axisSvg, ldData.snps, cellPx);
    drawLdLegend(legSvg, scaleType);
    // Center the triangle when it's narrower than the available area
    const triW = N * cellPx;
    const containerW = scrollWrap.clientWidth - MARGIN.left - MARGIN.right;
    if (triW < containerW) {
      const pad = MARGIN.left + Math.floor((containerW - triW) / 2);
      triInner.style.paddingLeft = pad + 'px';
    } else {
      triInner.style.paddingLeft = MARGIN.left + 'px';
    }
  }

  function redetect() {
    ldBlocks = showBlocks ? detectLdBlocks(ldData.matrix, N, bp) : [];
    updateBlockStatus();
    buildTri(scrollWrap._cs || cs);
  }
  buildTri(cs);

  // ── Hover interaction on canvas ──
  initTriangleHover(canvas, ldData.snps, ldData.matrix, plotWrap);

  // ── Initial connector draw (after browser layout) ──
  requestAnimationFrame(() => requestAnimationFrame(() =>
    drawConnectors(plotWrap, ldData, data, xScale, yScale, svgW, svgH, scrollWrap, cs)
  ));

  // ── Redraw connectors on horizontal scroll ──
  scrollWrap.addEventListener('scroll', () =>
    requestAnimationFrame(() =>
      drawConnectors(plotWrap, ldData, data, xScale, yScale, svgW, svgH, scrollWrap, scrollWrap._cs || cs)
    )
  );

  // ── Row 1 controls ──
  hdr.querySelector('.ldt-cell-slider').addEventListener('input', function() {
    cs = +this.value;
    hdr.querySelector('.ldt-cell-val').textContent = cs + 'px';
    buildTri(cs);
    requestAnimationFrame(() => requestAnimationFrame(() =>
      drawConnectors(plotWrap, ldData, data, xScale, yScale, svgW, svgH, scrollWrap, cs)
    ));
  });
  hdr.querySelector('.ldt-haploview-chk').addEventListener('change', function() {
    scaleType = this.checked ? 'haploview' : 'continuous';
    buildTri(scrollWrap._cs || cs);
  });

  // ── Row 2 controls — block detection ──
  brow.querySelector('.ldt-showblocks').addEventListener('change', function() {
    showBlocks = this.checked; redetect();
  });
  brow.querySelector('.ldt-strong').addEventListener('input', function() {
    bp.strongR2 = +this.value;
    brow.querySelector('.ldt-strong-val').textContent = (+this.value).toFixed(2);
    redetect();
  });
  brow.querySelector('.ldt-recom').addEventListener('input', function() {
    bp.recomR2 = +this.value;
    brow.querySelector('.ldt-recom-val').textContent = (+this.value).toFixed(2);
    redetect();
  });
  brow.querySelector('.ldt-prop').addEventListener('input', function() {
    bp.propThreshold = +this.value;
    brow.querySelector('.ldt-prop-val').textContent = Math.round(+this.value * 100) + '%';
    redetect();
  });
  brow.querySelector('.ldt-minblk').addEventListener('input', function() {
    bp.minBlockSize = Math.max(2, +this.value || 2);
    redetect();
  });
  brow.querySelector('.ldt-closetops').addEventListener('change', function() {
    closeBlockTops = this.checked; buildTri(scrollWrap._cs || cs);
  });
  brow.querySelector('.ldt-shade').addEventListener('change', function() {
    shadeBlocks = this.checked; buildTri(scrollWrap._cs || cs);
  });
  brow.querySelector('.ldt-labels').addEventListener('change', function() {
    labelBlocks = this.checked; buildTri(scrollWrap._cs || cs);
  });
}

// ─────────────────────────────────────────────────────────────
// LD block detection — Gabriel-style proportion-based rule
// ─────────────────────────────────────────────────────────────
function classifyPairs(matrix, a, b, strongR2, recomR2) {
  let strong = 0, recom = 0, uninform = 0, sum = 0, cnt = 0;
  for (let i = a; i <= b; i++) {
    for (let j = i + 1; j <= b; j++) {
      const v = matrix[i] ? matrix[i][j] : NaN;
      if (v == null || isNaN(v)) { uninform++; continue; }
      sum += v; cnt++;
      if (v >= strongR2) strong++;
      else if (v <= recomR2) recom++;
      else uninform++;
    }
  }
  const inform = strong + recom;
  const prop = inform > 0 ? strong / inform : 0;
  return { strong, recom, uninform, inform, prop, sum, cnt,
           meanR2: cnt > 0 ? sum / cnt : 0 };
}

function detectLdBlocks(matrix, N, params) {
  const { strongR2, recomR2, propThreshold, minInformPairs, minBlockSize } = params;
  const blocks = [];
  let a = 0;
  while (a < N) {
    let bestB = a, bestDiag = null;
    for (let b = a + 1; b < N; b++) {
      const diag = classifyPairs(matrix, a, b, strongR2, recomR2);
      if (diag.inform >= minInformPairs && diag.prop >= propThreshold) {
        bestB = b;
        bestDiag = diag;
      } else if (bestB > a) {
        break;
      }
    }
    const size = bestB - a + 1;
    if (size >= minBlockSize && bestDiag) {
      blocks.push({
        startIdx: a, endIdx: bestB, snpCount: size,
        meanR2: bestDiag.meanR2,
        diag: bestDiag
      });
      a = bestB + 1;
    } else {
      a++;
    }
  }
  return blocks;
}

// ─────────────────────────────────────────────────────────────
// Draw block outlines on canvas
// ─────────────────────────────────────────────────────────────
function drawBlockOutlines(ctx, blocks, cellSize, {closeTops, shade, labels, highlightIdx}) {
  const half = cellSize / 2;
  ctx.save();
  ctx.setLineDash([]);

  for (let bi = 0; bi < blocks.length; bi++) {
    const {startIdx: a, endIdx: b, snpCount, meanR2} = blocks[bi];
    const isHi = (bi === highlightIdx);

    const lx = (a + 0.5) * cellSize, ly = 0;
    const rx = (b + 0.5) * cellSize, ry = 0;
    const ax = (a + b + 1) * half,   ay = (b - a) * half;

    if (shade) {
      ctx.fillStyle = 'rgba(0,0,0,0.04)';
      ctx.beginPath();
      ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.lineTo(ax, ay);
      ctx.closePath(); ctx.fill();
    }

    ctx.strokeStyle = isHi ? '#E65C00' : '#1a1a2e';
    ctx.lineWidth   = isHi ? 3.0 : 2.0;
    ctx.lineJoin    = 'round';
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(ax, ay);
    ctx.lineTo(rx, ry);
    if (closeTops) ctx.closePath();
    ctx.stroke();

    if (labels) {
      const d = blocks[bi].diag;
      const txt = d
        ? `${snpCount} SNPs · r̄²${meanR2.toFixed(2)} · ${d.strong}S/${d.recom}R/${d.uninform}U ${(d.prop*100).toFixed(0)}%`
        : `${snpCount} SNPs · r̄² ${meanR2.toFixed(2)}`;
      ctx.font = '9px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = ctx.measureText(txt).width;
      const lx2 = ax, ly2 = ay + 10;
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.fillRect(lx2 - tw / 2 - 3, ly2 - 6, tw + 6, 12);
      ctx.fillStyle = '#1a1a2e';
      ctx.fillText(txt, lx2, ly2);
    }
  }
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────
// Triangle canvas renderer — filled diamonds, NO stroke
// Base at TOP (y=0), apex at BOTTOM
// ─────────────────────────────────────────────────────────────
function drawLdTriangle(canvas, snps, matrix, cellSize, scaleType, blocks, blockOpts) {
  const N = snps.length;
  if (N < 2) return;

  const dpr  = window.devicePixelRatio || 1;
  const half = cellSize / 2;
  const logW = N * cellSize;
  const logH = Math.ceil((N - 1) * cellSize / 2) + cellSize;

  canvas.width  = logW * dpr;
  canvas.height = logH * dpr;
  canvas.style.width  = logW + 'px';
  canvas.style.height = logH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, logW, logH);

  for (let i = 0; i < N; i++) {
    const row = matrix[i];
    if (!row) continue;
    for (let j = i + 1; j < N; j++) {
      let v = row[j];
      if (v === undefined || v === null || isNaN(v)) v = null;

      const cx = (i + j + 1) * half;
      const cy = (j - i) * half;

      ctx.fillStyle = r2Color(v, scaleType);
      ctx.beginPath();
      ctx.moveTo(cx,        cy - half);
      ctx.lineTo(cx + half, cy);
      ctx.lineTo(cx,        cy + half);
      ctx.lineTo(cx - half, cy);
      ctx.closePath();
      ctx.fill();
    }
  }

  const k = snps.findIndex(s => s.is_top_snp);
  if (k >= 0) {
    const lineX = (k + 0.5) * cellSize;
    ctx.save();
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = '#7B2D8B';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(lineX, 0);
    ctx.lineTo(lineX, logH);
    ctx.stroke();
    ctx.restore();
  }

  if (blocks && blocks.length > 0) {
    const bo = blockOpts || {};
    drawBlockOutlines(ctx, blocks, cellSize, {
      closeTops: bo.closeBlockTops || false,
      shade: bo.shadeBlocks || false,
      labels: bo.labelBlocks || false,
      highlightIdx: -1
    });
  }
}

// r² → fill color
function r2Color(r2, scaleType) {
  if (r2 === null || r2 === undefined || isNaN(r2)) return '#D0D0D0';
  const v = Math.max(0, Math.min(1, r2));
  if (scaleType === 'haploview') {
    if (v >= 0.8) return '#B20000';
    if (v >= 0.6) return '#E05C00';
    if (v >= 0.4) return '#F5A623';
    if (v >= 0.2) return '#F5E642';
    return '#F9F9F9';
  }
  // Continuous: white (r²=0) → deep red (r²=1)
  const g = Math.round(255 * (1 - v));
  const b = Math.round(255 * (1 - v));
  return `rgb(255,${g},${b})`;
}

// X-axis below the triangle canvas
function drawTriangleAxis(axisSvg, snps, cellSize) {
  const N = snps.length;
  axisSvg.setAttribute('width',  N * cellSize);
  axisSvg.setAttribute('height', LDT_AXIS_H);
  axisSvg.innerHTML = '';
  const k = snps.findIndex(s => s.is_top_snp);
  snps.forEach((snp, i) => {
    const x       = (i + 0.5) * cellSize;
    const isTop   = (i === k);
    const isTick  = (i % 10 === 0) || isTop;
    const isLabel = (i % 20 === 0) || isTop;
    if (!isTick) return;
    const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    tick.setAttribute('x1', x); tick.setAttribute('y1', 0);
    tick.setAttribute('x2', x); tick.setAttribute('y2', isTop ? 10 : 5);
    tick.setAttribute('stroke',       isTop ? '#7B2D8B' : '#94a3b8');
    tick.setAttribute('stroke-width', isTop ? '1.5' : '0.8');
    axisSvg.appendChild(tick);
    if (!isLabel) return;
    const mb  = fmtBp(snp.pos);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', x);
    lbl.setAttribute('y', 22);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size',   '8px');
    lbl.setAttribute('fill',        isTop ? '#7B2D8B' : '#64748b');
    if (isTop) lbl.setAttribute('font-weight', 'bold');
    lbl.textContent = isTop ? (snp.id && snp.id !== snp.bim_id ? snp.id : mb) : mb;
    axisSvg.appendChild(lbl);
  });
}

// Vertical color legend (r²=1 at top → r²=0 at bottom)
function drawLdLegend(legendSvg, scaleType) {
  legendSvg.innerHTML = '';
  const H = 100, steps = 40;
  const stepH = H / steps;
  for (let s = 0; s < steps; s++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', 0); r.setAttribute('y', s * stepH);
    r.setAttribute('width', 10); r.setAttribute('height', stepH + 0.5);
    r.setAttribute('fill',   r2Color(1 - s / steps, scaleType));
    r.setAttribute('stroke', 'none');
    legendSvg.appendChild(r);
  }
  // Border
  const border = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  border.setAttribute('x', 0); border.setAttribute('y', 0);
  border.setAttribute('width', 10); border.setAttribute('height', H);
  border.setAttribute('fill', 'none'); border.setAttribute('stroke', '#aaa');
  border.setAttribute('stroke-width', '0.5');
  legendSvg.appendChild(border);
  [['1.0', 4], ['0.5', H / 2], ['0.0', H]].forEach(([txt, y]) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', 12); t.setAttribute('y', y);
    t.setAttribute('font-size', '8px'); t.setAttribute('fill', '#64748b');
    t.setAttribute('dominant-baseline', 'middle');
    t.textContent = txt;
    legendSvg.appendChild(t);
  });
}

// Hover on canvas: hit-test cells, show tooltip, highlight connectors
function initTriangleHover(canvas, snps, matrix, plotWrap) {
  const N = snps.length;

  canvas.addEventListener('mousemove', (e) => {
    const cellPx = canvas._cellPx || LDT_CELL_PX_DEFAULT;
    const half   = cellPx / 2;
    const rect   = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Narrow row search: k = j-i ≈ my / half
    const kEst = Math.round(my / half);
    const kMin = Math.max(0, kEst - 1);
    const kMax = Math.min(N - 1, kEst + 1);

    let hitI = -1, hitJ = -1;
    outer:
    for (let k = kMin; k <= kMax; k++) {
      for (let i = 0; i + k < N; i++) {
        const j  = i + k;
        const cx = (i + j + 1) * half;
        const cy = k * half;
        if (Math.abs(mx - cx) + Math.abs(my - cy) <= half + 0.5) {
          hitI = i; hitJ = j; break outer;
        }
      }
    }

    const tip = document.getElementById('tooltip');
    if (hitI >= 0) {
      const snpI = snps[hitI], snpJ = snps[hitJ];
      const r2   = (matrix[hitI] && matrix[hitI][hitJ] != null) ? matrix[hitI][hitJ] : null;
      tip.querySelector('.tt-id').textContent   = `${snpI.id}  ×  ${snpJ.id}`;
      tip.querySelector('.tt-pos').textContent  = `${fmtBp(snpI.pos)}  /  ${fmtBp(snpJ.pos)}`;
      tip.querySelector('.tt-pval').textContent = `Δpos = ${fmtBp(Math.abs(snpJ.pos - snpI.pos))}`;
      tip.querySelector('.tt-r2').textContent   = r2 != null ? `r² = ${r2.toFixed(3)}` : 'r² = N/A';
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY - 32) + 'px';
      highlightConnectors(plotWrap, [hitI, hitJ]);
    } else {
      hideTip(tip);
      resetConnectors(plotWrap);
    }
  });

  canvas.addEventListener('mouseleave', () => {
    hideTip(document.getElementById('tooltip'));
    resetConnectors(plotWrap);
  });
}

// ═══════════════════════════════════════════════════════════════
// Connector lines: LD triangle ↔ Manhattan  (overlay SVG)
// ═══════════════════════════════════════════════════════════════
function drawConnectors(plotWrap, ldData, data, xScale, yScale, svgW, svgH, scrollWrap, cs) {
  if (!ldData || !ldData.snps || !scrollWrap) return;

  // Get or create the absolute-positioned overlay SVG
  let overlay = plotWrap.querySelector('.connector-overlay');
  if (!overlay) {
    overlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    overlay.setAttribute('class', 'connector-overlay');
    Object.assign(overlay.style, {
      position: 'absolute', top: '0', left: '0',
      pointerEvents: 'none', zIndex: '5', overflow: 'visible'
    });
    plotWrap.appendChild(overlay);
  }

  const plotRect = plotWrap.getBoundingClientRect();
  if (!plotRect.width) return;
  overlay.setAttribute('width',  plotRect.width);
  overlay.setAttribute('height', plotRect.height);

  const mainSvgEl = plotWrap.querySelector('.main-svg');
  if (!mainSvgEl) { while (overlay.firstChild) overlay.removeChild(overlay.firstChild); return; }
  const mainRect = mainSvgEl.getBoundingClientRect();

  // viewBox → screen-px (preserveAspectRatio xMidYMid meet)
  const scaleU = Math.min(mainRect.width / svgW, mainRect.height / svgH);
  const vbOffX = mainRect.left - plotRect.left + (mainRect.width  - svgW * scaleU) / 2;
  const vbOffY = mainRect.top  - plotRect.top  + (mainRect.height - svgH * scaleU) / 2;
  function vbPx(vbX, vbY) { return [vbOffX + vbX * scaleU, vbOffY + vbY * scaleU]; }

  const triRect    = scrollWrap.getBoundingClientRect();
  const scrollLeft = scrollWrap.scrollLeft;
  const triLeft    = triRect.left - plotRect.left;
  const triTop     = triRect.top  - plotRect.top;

  const panelCBotVB = MARGIN.top + PLOT_H;   // viewBox y of Manhattan bottom

  const posToNlp = {};
  (data.gwas_snps || []).forEach(s => { posToNlp[s.pos] = s.neg_log10_p; });

  while (overlay.firstChild) overlay.removeChild(overlay.firstChild);

  ldData.snps.forEach((snp, i) => {
    const mxVB = xScale(snp.pos);
    if (mxVB < xScale.range()[0] - 10 || mxVB > xScale.range()[1] + 10) return;

    const nlp   = posToNlp[snp.pos];
    const myVB  = (nlp != null) ? yScale(nlp) : panelCBotVB;
    const isTop = snp.is_top_snp;

    const [mx,  my]    = vbPx(mxVB, myVB);
    const [mcbx, mcby] = vbPx(mxVB, panelCBotVB);

    // Triangle base x: scroll container left + left padding + cell center - scroll
    const canvas = scrollWrap.querySelector('canvas');
    const canvasRect = canvas ? canvas.getBoundingClientRect() : triRect;
    const triBaseX = (canvasRect.left - plotRect.left)
                   + (i + 0.5) * cs
                   - scrollLeft;
    const triBaseY = triTop;

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('class', `conn-line conn-${i}${isTop ? ' conn-top' : ''}`);
    p.setAttribute('d',     `M${mx},${my} L${mcbx},${mcby} L${triBaseX},${triBaseY}`);
    p.setAttribute('fill',  'none');
    p.setAttribute('stroke',           isTop ? '#7B2D8B' : '#999999');
    p.setAttribute('stroke-width',     isTop ? '1.2'    : '0.7');
    p.setAttribute('stroke-dasharray', isTop ? '4,2'    : '3,3');
    p.setAttribute('opacity',          isTop ? '0.85'   : '0.4');
    overlay.appendChild(p);
  });
}

function highlightConnectors(plotWrap, activeRanks) {
  const overlay = plotWrap.querySelector('.connector-overlay');
  if (!overlay) return;
  overlay.querySelectorAll('.conn-line').forEach(el => {
    const m = (el.getAttribute('class') || '').match(/conn-(\d+)/);
    if (!m) return;
    if (activeRanks.includes(+m[1])) {
      el.setAttribute('stroke',       '#E65C00');
      el.setAttribute('stroke-width', '1.5');
      el.setAttribute('opacity',      '1.0');
    } else {
      el.setAttribute('opacity', '0.08');
    }
  });
}

function resetConnectors(plotWrap) {
  const overlay = plotWrap.querySelector('.connector-overlay');
  if (!overlay) return;
  overlay.querySelectorAll('.conn-line').forEach(el => {
    const isTop = el.classList.contains('conn-top');
    el.setAttribute('stroke',           isTop ? '#7B2D8B' : '#999999');
    el.setAttribute('stroke-width',     isTop ? '1.2'    : '0.7');
    el.setAttribute('opacity',          isTop ? '0.85'   : '0.4');
  });
}

// ═══════════════════════════════════════════════════════════════
// Zoom redraw
// ═══════════════════════════════════════════════════════════════
function redrawOnZoom(svg, data, newX, yScale, geneRows, visGenes, doGenes, doLd) {
  const x1 = newX.range()[0], x2 = newX.range()[1];

  // SNP circles — x only (y scale unchanged)
  svg.selectAll('.snp-circle').attr('cx', s => newX(s.pos));

  // Top SNP diamond — recompute path from bound datum + unchanged yScale
  svg.selectAll('.top-snp-diamond').each(function(s) {
    if (!s) return;
    const tx = newX(s.pos), ty = yScale(s.neg_log10_p), r = 8;
    d3.select(this).attr('d', `M${tx},${ty-r} L${tx+r},${ty} L${tx},${ty+r} L${tx-r},${ty}Z`);
  });

  // Locus boundary highlight
  const lr = svg.select('.locus-region');
  if (!lr.empty()) {
    const lx1 = Math.max(newX(data.start), x1);
    const lx2 = Math.min(newX(data.end), x2);
    if (lx2 > lx1) {
      lr.attr('x', lx1).attr('width', lx2 - lx1).attr('display', null);
    } else {
      lr.attr('display', 'none');
    }
  }

  // Significance lines
  svg.select('.gw-line').attr('x1',x1).attr('x2',x2);
  svg.select('.sug-line').attr('x1',x1).attr('x2',x2);

  // Gene track — clear and redraw with new x-scale
  if (doGenes) {
    const gGene = svg.select('.gene-group-root');
    gGene.selectAll('*').remove();
    renderGeneTrack(gGene, visGenes, geneRows, newX, geneRows.length * GENE_ROW + 16);
  }

  // LD bar track — clear and redraw with new x-scale
  if (doLd) {
    const gLd = svg.select('.ld-section');
    gLd.selectAll('*').remove();
    renderLdTrack(gLd, data.gwas_snps, newX, LD_H, data.top_snp);
  }
}

// ═══════════════════════════════════════════════════════════════
// Tooltip
// ═══════════════════════════════════════════════════════════════
function showTip(tip, ev, s) {
  tip.querySelector('.tt-id').textContent   = s.id;
  tip.querySelector('.tt-pos').textContent  = `Chr${s.chr}:${fmtN(s.pos)}`;
  tip.querySelector('.tt-pval').textContent = `P = ${s.pvalue.toExponential(3)}`;
  const _r2 = snpR2(s);
  tip.querySelector('.tt-r2').textContent   =
    _r2 >= 0 ? `r² = ${_r2.toFixed(3)}` : 'r² = N/A';
  tip.style.display = 'block'; moveTip(tip, ev);
}
function moveTip(tip, ev) {
  tip.style.left = (ev.clientX + 14) + 'px';
  tip.style.top  = (ev.clientY - 32) + 'px';
}
function hideTip(tip) { tip.style.display = 'none'; }

// ═══════════════════════════════════════════════════════════════
// Navigation
// ═══════════════════════════════════════════════════════════════
function setupNav() {
  document.getElementById('prev-btn').addEventListener('click', () => {
    if (currentStart > 0) { currentStart--; renderViewport(true); }
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    if (currentStart + VISIBLE < lociOrder.length) { currentStart++; renderViewport(true); }
  });
}

function updateNavUI() {
  const endPos = Math.min(currentStart + VISIBLE, lociOrder.length);
  const showFrom = currentStart + 1;
  const showTo = endPos;
  document.getElementById('nav-counter').textContent =
    `Showing loci ${showFrom}–${showTo} of ${lociOrder.length}`;
  document.getElementById('prev-btn').disabled = currentStart <= 0;
  document.getElementById('next-btn').disabled = currentStart + VISIBLE >= lociOrder.length;
}

// ═══════════════════════════════════════════════════════════════
// Search
// ═══════════════════════════════════════════════════════════════
function setupSearch() {
  const input = document.getElementById('search-input');
  const dd    = document.getElementById('search-dropdown');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    dd.innerHTML = '';
    if (!q) { dd.style.display = 'none'; return; }

    const hits = [];
    manifest.loci.forEach(entry => {
      const nameMatch  = entry.locus_name.toLowerCase().includes(q);
      const geneMatch  = (entry.nearest_genes||[]).some(g => g.toLowerCase().includes(q));
      const snpMatch   = entry.top_snp && entry.top_snp.toLowerCase().includes(q);
      const idxMatch   = String(entry.index).includes(q);
      if (nameMatch || geneMatch || snpMatch || idxMatch) hits.push(entry);
    });

    if (!hits.length) { dd.style.display = 'none'; return; }
    hits.slice(0,12).forEach(entry => {
      const item = document.createElement('div');
      item.className = 'search-item';
      item.innerHTML =
        `<div class="si-name">${entry.locus_name}</div>
         <div class="si-sub">${(entry.nearest_genes||[]).join(', ')} &nbsp;|&nbsp; ${entry.top_snp||'—'}</div>`;
      item.addEventListener('click', () => {
        // Jump to the locus: navigate viewport to show it
        const idx = entry.index;
        const pos = lociOrder.indexOf(idx);
        if (pos >= 0) currentStart = Math.max(0, Math.min(pos, lociOrder.length - VISIBLE));
        renderViewport(true);
        dd.style.display = 'none';
        input.value = '';
      });
      dd.appendChild(item);
    });
    dd.style.display = 'block';
  });

  document.addEventListener('click', e => {
    if (!document.getElementById('search-wrap').contains(e.target)) {
      dd.style.display = 'none';
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// Toggle buttons
// ═══════════════════════════════════════════════════════════════
function setupToggles() {
  function tog(id, getter, setter, sectionClass) {
    document.getElementById(id).addEventListener('click', function() {
      this.classList.toggle('active');
      setter(this.classList.contains('active'));
      // Show/hide matching sections in rendered panels
      document.querySelectorAll('.' + sectionClass).forEach(el => {
        el.classList.toggle('hidden', !getter());
      });
    });
  }
  tog('toggle-ctx',   () => showCtx,   v => { showCtx   = v; }, 'ctx-section');
  tog('toggle-genes', () => showGenes, v => { showGenes = v; }, 'genes-section');
  tog('toggle-ld',    () => showLd,    v => { showLd    = v; }, 'ld-section');
  tog('toggle-ldt',   () => showLdTri, v => { showLdTri = v; }, 'ldt-section');
}
