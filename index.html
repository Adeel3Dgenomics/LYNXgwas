<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYNXgwas – Locus Analysis and Genomic Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ─── Reset ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#f0f2f5;color:#1a1a2e;font-size:13px}

/* ─── Startup loading overlay ───────────────────────────── */
#loading-overlay{position:fixed;inset:0;background:#0f1021;
  display:flex;align-items:center;justify-content:center;z-index:999;
  transition:opacity .4s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-box{width:420px;text-align:center}
.loading-title{font-size:22px;font-weight:800;color:#c084fc;margin-bottom:24px}
.loading-phase{font-size:15px;color:#e2e8f0;margin-bottom:6px}
.loading-sub{font-size:12px;color:#94a3b8;margin-bottom:16px;min-height:18px}
.loading-bar-track{background:#2d2f50;border-radius:99px;height:10px;overflow:hidden;margin-bottom:10px}
.loading-bar-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#4f46e5);
  border-radius:99px;transition:width .5s ease;width:0%}
.loading-count{font-size:11px;color:#64748b}
.loading-skip{margin-top:20px;font-size:11px;color:#4a4c6e;cursor:pointer}
.loading-skip:hover{color:#94a3b8}

/* ─── LD triangle panel ─────────────────────────────────── */
.ldt-wrap{padding:0 14px 8px}
.ldt-wrap.hidden{display:none}
.ldt-section.hidden{display:none}
.ldt-connector{pointer-events:none}
.ldt-scroll-outer{padding:8px 0 2px}
.ldt-header{display:flex;align-items:center;padding:0 14px 4px;min-height:22px}
.ldt-inner-scroll{overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.ldt-tri-inner{display:inline-block;vertical-align:top}
.ldt-triangle-canvas{display:block;image-rendering:pixelated}
.connector-overlay{pointer-events:none}

/* ─── Global header ──────────────────────────────────────── */
#global-header{
  position:sticky;top:0;z-index:50;
  background:#1e2040;color:#e2e8f0;
  display:flex;align-items:center;gap:12px;
  padding:8px 16px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#tool-title{font-weight:700;font-size:14px;color:#c084fc;white-space:nowrap}
#search-wrap{position:relative;flex:1;max-width:280px}
#search-input{width:100%;padding:5px 10px;border:1px solid #3d3f5c;border-radius:16px;
  background:#2d2f50;color:#e2e8f0;font-size:12px;outline:none}
#search-input:focus{border-color:#c084fc}
#search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:#2d2f50;border:1px solid #3d3f5c;border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);max-height:300px;overflow-y:auto;
  display:none;z-index:200}
.search-item{padding:7px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #3d3f5c}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:#3d3f5c}
.search-item .si-name{color:#c084fc;font-weight:600}
.search-item .si-sub{color:#94a3b8;font-size:11px}

#toggles{display:flex;gap:6px}
.toggle-btn{padding:4px 11px;border:1px solid #4a4c6e;border-radius:14px;
  background:transparent;color:#94a3b8;font-size:11px;cursor:pointer;transition:all .15s}
.toggle-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}

#nav-controls{display:flex;align-items:center;gap:8px;margin-left:auto}
#nav-counter{font-size:12px;color:#94a3b8;white-space:nowrap}
.nav-btn{padding:5px 12px;border:1px solid #4a4c6e;border-radius:6px;
  background:transparent;color:#e2e8f0;cursor:pointer;font-size:12px;transition:all .15s}
.nav-btn:hover:not(:disabled){background:#2d2f50}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}

#export-pdf-btn{padding:5px 14px;background:#7c3aed;color:#fff;
  border:none;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
#export-pdf-btn:hover{background:#6d28d9}

/* ─── Main viewport ──────────────────────────────────────── */
#main{padding:16px;overflow-y:auto;height:calc(100vh - 46px)}
#panels-container{display:flex;flex-direction:column;gap:20px;
  transition:opacity .2s ease,transform .2s ease}
#panels-container.transitioning{opacity:0;transform:translateY(10px)}

/* ─── Per-locus panel ────────────────────────────────────── */
.locus-panel{background:#fff;border-radius:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}

/* A: Header */
.locus-header{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:linear-gradient(90deg,#312e81 0%,#4c1d95 100%);color:#fff}
.lh-title{font-weight:700;font-size:13px;min-width:120px;white-space:nowrap}
.lh-ops{display:flex;gap:4px;margin-left:4px}
.lh-op-btn{padding:2px 8px;border:1px solid rgba(255,255,255,0.3);border-radius:3px;
  background:rgba(255,255,255,0.1);color:#e0e7ff;font-size:10px;font-weight:600;cursor:pointer}
.lh-op-btn:hover{background:rgba(255,255,255,0.25);color:#fff}
.lh-genes{flex:1;font-size:11px;color:#c4b5fd}
.lh-top{font-size:11px;text-align:right;white-space:nowrap}
.lh-top strong{color:#fbbf24}
.warning-banner{background:#fffbeb;color:#92400e;padding:4px 14px;
  font-size:11px;border-bottom:1px solid #fde68a}
.empty-msg{padding:40px;text-align:center;color:#94a3b8;font-style:italic}
.plot-loading{padding:32px;text-align:center;color:#94a3b8;font-size:12px}

/* Panel wrappers */
.ctx-wrap{padding:4px 14px 0;display:block}
.ctx-wrap.hidden{display:none}
.plot-wrap{padding:0 14px 10px;position:relative}
.genes-wrap,.ld-wrap{padding:0 14px 8px}
.genes-wrap.hidden,.ld-wrap.hidden,.ctx-wrap.hidden{display:none}

/* Per-locus PNG button */
.dl-png-btn{position:absolute;top:6px;right:16px;padding:3px 9px;
  background:#f8fafc;border:1px solid #cbd5e1;border-radius:5px;
  font-size:11px;cursor:pointer;color:#475569}
.dl-png-btn:hover{background:#e2e8f0}

/* LD legend */
.ld-legend{display:flex;gap:10px;align-items:center;
  padding:3px 14px 6px;font-size:11px;color:#64748b;flex-wrap:wrap}
.ld-swatch{width:12px;height:12px;border-radius:2px;display:inline-block;
  vertical-align:middle;margin-right:3px}

/* Overview density strip */
.overview-wrap{padding:4px 14px 0}

/* Genome-wide skyline panel — sticky below header */
#genome-skyline{background:#f8f9fb;padding:8px 16px 4px;
  border-bottom:2px solid #e2e8f0;cursor:pointer;
  position:sticky;top:46px;z-index:40}
#genome-skyline .sky-label{font-size:11px;color:#475569;font-weight:600;margin-bottom:4px}
#genome-skyline svg{display:block}

/* Gene filter controls */
.gene-filter{display:flex;align-items:center;gap:10px;padding:2px 14px 4px;
  font-size:11px;color:#475569;flex-wrap:wrap}
.gene-filter label{display:flex;align-items:center;gap:4px;cursor:pointer}
.gene-filter .gf-count{margin-left:auto;color:#94a3b8;font-size:10px}
.gene-filter .gf-quick{color:#6366f1;cursor:pointer;font-size:10px;
  text-decoration:underline;border:none;background:none;padding:0}
.gene-filter .gf-quick:hover{color:#4338ca}
.gene-filter .gf-sep{width:1px;height:16px;background:#d1d5db;margin:0 4px}
.exonic-mode .snp-circle:not(.snp-exonic){opacity:0.07!important}
.exonic-mode .snp-circle.snp-exonic{stroke:#000!important;stroke-width:1px!important}
.locus-handle-left:hover,.locus-handle-right:hover{opacity:1!important;fill:#7f1d1d!important}
.locus-update-btn{padding:3px 12px;border:none;border-radius:4px;background:#b91c1c;color:#fff;
  font-size:11px;font-weight:600;cursor:pointer;margin-left:12px;vertical-align:middle;
  animation:fadeInBtn .25s ease}
.locus-update-btn:hover{background:#991b1b}
.locus-update-btn:disabled{cursor:wait}
@keyframes fadeInBtn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

/* Track section visibility toggles */
.genes-section.hidden,.ld-section.hidden,.ctx-section.hidden{display:none}

/* Axes */
.axis text{font-size:10px;fill:#6b7280}
.axis path,.axis line{stroke:#e5e7eb}

/* Tooltip */
#tooltip{position:fixed;background:rgba(15,15,30,.9);color:#e2e8f0;
  padding:8px 12px;border-radius:8px;font-size:12px;pointer-events:none;
  display:none;z-index:200;line-height:1.7;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#tooltip .tt-id{font-weight:700;color:#c084fc}
#tooltip .tt-pval{color:#f87171}
#tooltip .tt-r2{color:#34d399}

/* ─── Modal overlay ──────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;z-index:300}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:520px;max-width:96vw;
  box-shadow:0 8px 40px rgba(0,0,0,.3);overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.modal-header h3{font-size:14px;font-weight:700;color:#1e293b}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:#94a3b8;line-height:1}
.modal-close:hover{color:#475569}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-section{border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px}
.modal-section h4{font-size:12px;font-weight:700;color:#475569;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.field-row:last-child{margin-bottom:0}
.field-row label{font-size:12px;color:#374151;white-space:nowrap;min-width:100px}
.field-row input[type=text],.field-row input[type=number],.field-row select{
  flex:1;padding:5px 9px;border:1px solid #d1d5db;border-radius:6px;
  font-size:12px;outline:none}
.field-row input:focus,.field-row select:focus{border-color:#7c3aed}
.radio-group,.check-group{display:flex;gap:14px;flex-wrap:wrap}
.radio-group label,.check-group label{display:flex;align-items:center;
  gap:5px;font-size:12px;cursor:pointer;color:#374151}
.range-inputs{display:flex;align-items:center;gap:8px}
.range-inputs input{width:70px}
.folder-row{display:flex;gap:8px}
.folder-row input{flex:1}
.folder-browse{padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;
  background:#f9fafb;cursor:pointer;font-size:11px}
.modal-footer{padding:14px 18px;background:#f8fafc;border-top:1px solid #e2e8f0;
  display:flex;justify-content:flex-end;gap:10px}
.btn-cancel{padding:7px 16px;border:1px solid #d1d5db;border-radius:6px;
  background:#fff;cursor:pointer;font-size:12px}
.btn-start{padding:7px 16px;background:#7c3aed;color:#fff;border:none;
  border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn-start:hover{background:#6d28d9}

/* ─── Progress dialog ────────────────────────────────────── */
#pdf-progress-modal .modal{width:460px}
.progress-msg{font-size:13px;color:#374151;margin-bottom:10px;min-height:20px}
.progress-bar-wrap{background:#e2e8f0;border-radius:99px;height:12px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#4f46e5);
  border-radius:99px;transition:width .3s ease;width:0%}
.progress-stats{display:flex;justify-content:space-between;
  font-size:11px;color:#6b7280;margin-top:6px}
.btn-cancel-export{padding:7px 16px;background:#dc2626;color:#fff;
  border:none;border-radius:6px;cursor:pointer;font-size:12px}

/* ─── Toast ──────────────────────────────────────────────── */
#toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#e2e8f0;
  padding:10px 18px;border-radius:8px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);
  display:none;z-index:400;transition:opacity .3s}
</style>
</head>
<body>

<!-- Startup loading overlay -->
<div id="loading-overlay">
  <div class="loading-box">
    <div class="loading-title">LYNXgwas</div>
    <div class="loading-phase" id="loading-phase">Starting pipeline…</div>
    <div class="loading-sub" id="loading-sub">Connecting to Java backend…</div>
    <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-fill"></div></div>
    <div class="loading-count" id="loading-count"></div>
    <div class="loading-skip" onclick="skipLoading()">Skip — open viewer with existing data</div>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-id"></div>
  <div class="tt-pos"></div>
  <div class="tt-pval"></div>
  <div class="tt-r2"></div>
</div>
<!-- Toast -->
<div id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- PDF Config Modal                                           -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div id="pdf-config-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>📄 Export Loci to PDF</h3>
      <button class="modal-close" id="pdf-cfg-close">✕</button>
    </div>
    <div class="modal-body">
      <!-- Loci selection -->
      <div class="modal-section">
        <h4>Loci to export</h4>
        <div class="radio-group">
          <label><input type="radio" name="loci-range" value="all" checked> All loci (<span id="cfg-total">?</span> total)</label>
          <label><input type="radio" name="loci-range" value="view"> Current view only</label>
          <label><input type="radio" name="loci-range" value="custom"> Custom range:</label>

        <div class="field-row" style="margin-top:8px" id="custom-range-row">
          <label>From locus</label>
          <div class="range-inputs">
            <input type="number" id="range-from" value="1" min="1">
            <span style="color:#64748b">to</span>

      </div>

        <div class="field-row">

            <label><input type="radio" name="loci-per-page" value="2" checked> 2</label>
            <label><input type="radio" name="loci-per-page" value="3"> 3</label>

        <div class="field-row">
          <label>Orientation</label>
          <div class="radio-group">
            <label><input type="radio" name="orientation" value="landscape" checked> Landscape</label>
            <label><input type="radio" name="orientation" value="portrait"> Portrait</label>
          </div>
        </div>
        <div class="field-row">
          <label>Page size</label>
          <select id="page-size">
            <option value="a4">A4</option>
            <option value="a3">A3</option>
            <option value="letter">Letter</option>

      <!-- Tracks -->
      <div class="modal-section">
        <h4>Tracks to include</h4>
        <div class="check-group">

          <label><input type="checkbox" id="cfg-plot"  checked> Association plot</label>
          <label><input type="checkbox" id="cfg-genes" checked> Gene structure</label>
          <label><input type="checkbox" id="cfg-ld"    checked> LD bar track</label>
        </div>
      </div>
      <!-- Output -->
      <div class="modal-section">
        <h4>Output</h4>
        <div class="field-row">
          <label>Filename</label>
          <input type="text" id="cfg-filename" value="gwas_loci_plots.pdf">

        <div class="field-row">
          <label>Save to</label>
          <div class="folder-row" style="flex:1">
            <input type="text" id="cfg-folder" placeholder="Browser downloads folder (default)">
            <button class="folder-browse" id="cfg-browse">Browse…</button>
          </div>

    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="pdf-cfg-cancel">Cancel</button>

</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- PDF Progress Modal                                         -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div id="pdf-progress-modal" class="modal-overlay">

    <div class="modal-header">

<!-- App                                                        -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div id="global-header">
  <span id="tool-title">LYNXgwas</span>

  <div id="search-wrap">
